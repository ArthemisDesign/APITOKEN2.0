# Workspace: пул Claude-подписок как прозрачный /v1 API.
# Слои (снизу вверх): registry ← pool ← forward ← server(bin).
# Границы зависимостей — в crates/*/CLAUDE.md; архитектура — в docs/engine/ARCHITECTURE.md.
# crates/router стоит ВНЕ слоёв: отдельный bounded context (docs/engine/UNIFIED_ROUTER.md),
# общается с плоскостями только по HTTP и не импортирует pool/forward/registry.
[workspace]
resolver = "2"
members = [
    "crates/gemini-credential",
    "crates/codex-credential",
    "crates/kimi-credential",
    "crates/registry",
    "crates/pool",
    "crates/forward",
    "crates/server",
    "crates/metering",
    "crates/authbot",
    "crates/router",
]

[profile.release]
opt-level = 2
lto = "thin"
