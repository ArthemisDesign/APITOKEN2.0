[package]
name = "claude-api"
version = "0.1.0"
edition = "2021"
description = "Пул Claude-подписок как прозрачный /v1 API (неотличим от api.anthropic.com)"

[[bin]]
name = "claude-api"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "socks", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
bytes = "1"

[profile.release]
opt-level = 2
lto = "thin"
