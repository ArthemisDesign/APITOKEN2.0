name: apitoken-affinity

# Two instances, not two logical databases. `maxmemory` and `maxmemory-policy` are per-instance in
# Redis, so selecting a database would leave both consumers sharing one budget and one eviction
# policy — which is exactly the failure this file exists to prevent.
#
# The two consumers have very different blast radii:
#   * cache affinity stores short keyed digests. Losing one costs a prompt-cache hit. Fail-open.
#   * Codex response history stores whole conversations, up to 16 MiB each. Losing one makes the
#     engine answer previous_response_id with a 400 that well-behaved clients treat as permanent,
#     so they discard a conversation the customer already paid to build.
# While they shared one instance, a few dozen large conversations could evict affinity, and
# affinity churn could evict conversations.
#
# ZERO-DOWNTIME TRANSITION. The pre-split service identity `affinity-redis`, port 6379, command and
# data directory stay byte-for-byte stable. Docker Compose can therefore add the second service
# without recreating the container that holds live Codex response history. The legacy service name
# is intentionally less important than preserving those conversations. Cache affinity moves to
# 6380 because losing it costs only prompt-cache hit rate for one TTL.
services:
  # Legacy Compose service identity; this instance now owns Codex response history only.
  affinity-redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    environment:
      CLAUDE_API_REDIS_PASSWORD: ${CLAUDE_API_REDIS_PASSWORD:?CLAUDE_API_REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${CLAUDE_API_REDIS_PASSWORD:?CLAUDE_API_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /var/lib/apitoken/affinity-redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          set apitoken:healthcheck "$${HOSTNAME}" EX 10 | grep -qx OK &&
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          info persistence | tr -d '\r' | grep -qx 'aof_enabled:1' &&
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          info persistence | tr -d '\r' | grep -qx 'aof_last_bgrewrite_status:ok' &&
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          info persistence | tr -d '\r' | grep -qx 'rdb_last_bgsave_status:ok'
      interval: 3s
      timeout: 2s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cache-lineage affinity. Same password and trust domain as history: both are loopback-only,
  # root-provisioned and read by the same engine process, so separate credentials would add
  # provisioning failure modes without isolating anything.
  cache-affinity-redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    environment:
      CLAUDE_API_REDIS_PASSWORD: ${CLAUDE_API_REDIS_PASSWORD:?CLAUDE_API_REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${CLAUDE_API_REDIS_PASSWORD:?CLAUDE_API_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - /var/lib/apitoken/affinity-redis-l2:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          set apitoken:healthcheck "$${HOSTNAME}" EX 10 | grep -qx OK &&
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          info persistence | tr -d '\r' | grep -qx 'aof_enabled:1' &&
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          info persistence | tr -d '\r' | grep -qx 'aof_last_bgrewrite_status:ok' &&
          REDISCLI_AUTH=$$CLAUDE_API_REDIS_PASSWORD redis-cli --no-auth-warning
          info persistence | tr -d '\r' | grep -qx 'rdb_last_bgsave_status:ok'
      interval: 3s
      timeout: 2s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
