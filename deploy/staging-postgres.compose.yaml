name: apitoken-stage-postgres
services:
  postgres-stage:
    image: apitoken-stage/postgres:18-alpine
    container_name: apitoken-postgres-stage
    restart: unless-stopped
    environment:
      POSTGRES_DB: stage_empty
      POSTGRES_USER: stage
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "10.254.32.2:5433:5432"
    volumes:
      - /var/lib/apitoken-staging/postgres:/var/lib/postgresql
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    cgroup_parent: staging.slice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d stage_empty"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  postgres_password:
    file: /etc/apitoken-staging/postgres.password
