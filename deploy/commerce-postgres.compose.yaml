# Явное имя проекта: сервис поднят из каталога deploy/ (проект «deploy»), а watchdog-backup
# exec-ает через контроллер-копию в …/apitoken-watchdog/controller/ — без пина compose вывел бы
# имя проекта из каталога («controller») и не нашёл бы работающий контейнер.
name: deploy

services:
  commerce-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /var/lib/apitoken/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
