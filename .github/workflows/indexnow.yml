name: Search-engine ping

# Notify Yandex/Bing (IndexNow) and Google (GSC sitemap re-submit) after web
# content deploys. Google's Indexing API only accepts job postings, so the
# authenticated sitemap submit is its only legitimate automated channel.
on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
  workflow_dispatch: {}

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vercel builds the same push; give it time to go live so the
      # engines crawl fresh pages, then submit the full sitemap.
      - name: Wait for Vercel deploy
        run: sleep 240
      - name: Submit sitemap URLs to IndexNow
        run: node apps/web/scripts/indexnow.mjs
      # Skips itself with a friendly log line when the secret is not configured.
      - name: Re-submit sitemap to Google Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: node apps/web/scripts/google-sitemap.mjs
