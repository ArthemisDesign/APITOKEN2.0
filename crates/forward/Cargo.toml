[package]
name = "forward"
version = "0.1.0"
edition = "2021"
description = "Прозрачный форвардинг /v1/* на api.anthropic.com на квоте подписок пула"

[lib]
path = "src/lib.rs"

[dependencies]
registry = { path = "../registry" }
pool = { path = "../pool" }
metering = { path = "../metering" }
gemini-credential = { path = "../gemini-credential" }
codex-credential = { path = "../codex-credential" }
kimi-credential = { path = "../kimi-credential" }
glm-credential = { path = "../glm-credential" }
tokio = { version = "1", features = ["sync", "rt", "time", "process", "io-util", "macros"] }
anyhow = "1"
axum = "0.8"
# TLS-транспорт: wreq (форк reqwest на BoringSSL/boring2). Claude Code 2.1.195 = Bun 1.4.0 = BoringSSL,
# поэтому наш ClientHello делаем БАЙТ-В-БАЙТ как у Claude Code (JA3=d871d02c…, JA4 совпадают): кастомный
# TlsConfig — grease off, Bun cipher-list (IANA), OCSP+SCT расширения, curves x25519/P256/P384, ALPN http/1.1
# (см. nodetls::bun_emulation). API близок к reqwest (Client/RequestBuilder/Response/bytes_stream/json).
# Сборка требует clang+cmake (BoringSSL) — есть на сервере.
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "stream", "json", "socks", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
bytes = "1"
base64 = "0.22"
hound = "3.5.1"
blake3 = "1"
getrandom = "0.3"
chacha20poly1305 = "0.10"
sha2 = "0.10"
libc = "0.2"
redis = { version = "1.4.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde_urlencoded = "0.7"
zeroize = "1"

[dev-dependencies]
gemini-credential = { path = "../gemini-credential", features = ["test-loopback-token-uri"] }
codex-credential = { path = "../codex-credential", features = ["test-loopback-token-uri"] }
glm-credential = { path = "../glm-credential", features = ["test-loopback-base-url"] }
postgres = "0.19"
