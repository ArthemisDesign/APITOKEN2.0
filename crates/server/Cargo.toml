[package]
name = "claude-api"
version = "0.1.0"
edition = "2021"
description = "Композиция: CLI реестра + HTTP-сервер (пул подписок как прозрачный /v1 API)"

[[bin]]
name = "claude-api"
path = "src/main.rs"

[dependencies]
registry = { path = "../registry" }
pool = { path = "../pool" }
forward = { path = "../forward" }
metering = { path = "../metering" }
elog = { path = "../elog" }
gemini-credential = { path = "../gemini-credential" }
codex-credential = { path = "../codex-credential" }
base64 = "0.22"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
futures-util = "0.3"  # адаптер тела ответа: гейт активных запросов живёт до последнего байта
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }  # отдельная metrics.db для истории (не money-БД)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
kimi-credential = { path = "../kimi-credential" }
glm-credential = { path = "../glm-credential" }
