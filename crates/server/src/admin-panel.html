<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>apiToken.sale · admin</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f8f9fb;--line:#e2e6ec;--line2:#edf0f4;--text:#161a22;--muted:#68707e;--faint:#98a0ac;
--accent:#3f66e0;--accent-soft:#e9efff;--accent-text:#2f4fc4;--ok:#15803d;--ok-soft:#e4f5eb;--warn:#b45309;--warn-soft:#fcf0dd;
--bad:#c92a2a;--bad-soft:#fceaea;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.04);
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
[data-theme=dark]{--bg:#0c0e11;--panel:#14171c;--panel2:#1a1e24;--line:#242a33;--line2:#1e242c;--text:#e5e9f0;--muted:#97a0ad;--faint:#646e7c;
--accent:#8aa5ff;--accent-soft:#1a2440;--accent-text:#a5baff;--ok:#4ade80;--ok-soft:#122a1b;--warn:#fbbf24;--warn-soft:#2c2210;
--bad:#f87171;--bad-soft:#2e1515;--shadow:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}
button,input,select{font:inherit;color:inherit}::selection{background:var(--accent-soft)}
#shell{display:flex;min-height:100vh}
/* ── Sidebar ─────────────────────────────────────────────── */
aside{width:238px;flex:0 0 238px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
display:flex;flex-direction:column;padding:20px 14px 14px;z-index:20}
.brand{font:800 17px/1.2 var(--sans);letter-spacing:-.02em;padding:0 10px;white-space:nowrap}
.brand i{color:var(--accent);font-style:normal}
.brand small{display:block;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
nav{flex:1;margin-top:22px;overflow-y:auto}
.nav-group{font:700 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:550;cursor:pointer;
text-decoration:none;margin:1px 0;transition:background .12s,color .12s}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.nav-item .ico{width:17px;text-align:center;font-size:13px;opacity:.85}
.side-foot{border-top:1px solid var(--line2);padding-top:12px;display:flex;align-items:center;gap:8px}
.side-foot .env{font:600 10px/1.4 var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.theme{margin-left:auto;border:1px solid var(--line);background:var(--panel2);width:34px;height:30px;border-radius:8px;cursor:pointer}
.theme:hover{border-color:var(--accent)}
/* ── Main ────────────────────────────────────────────────── */
main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1440px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:0}
.page-head .sub{color:var(--muted);margin:3px 0 0;font-size:13px}
.page-head .badge{margin-left:auto}
.sect{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.sect h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
.sect .sect-sub{color:var(--faint);font-size:12px}
/* ── Banners ─────────────────────────────────────────────── */
.banner{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
box-shadow:var(--shadow);margin-bottom:14px}
.banner .dot{margin-top:6px}
.banner b{display:block;font-size:14px;font-weight:650}
.banner .muted{font-size:12.5px}
.banner.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.banner.ok b{color:var(--ok)}.banner.warn b{color:var(--warn)}.banner.bad b{color:var(--bad)}
.banner.ok .muted,.banner.warn .muted,.banner.bad .muted{color:var(--text);opacity:.75}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 9px}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.off{background:var(--faint)}
/* ── Stat cards ──────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card .label{font:650 10.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.card .value{font:750 26px/1.15 var(--sans);letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hint{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.clickable{cursor:pointer}.card.clickable:hover{border-color:var(--accent)}
/* ── Tables ──────────────────────────────────────────────── */
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:4px}
.tscroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
th{font:650 10.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);background:var(--panel2);
position:sticky;top:0;z-index:1;text-align:right}
tbody tr{transition:background .1s}tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
th.left,td.left{text-align:left}
td b{font-weight:650}
.sub{font-size:11.5px;color:var(--faint);margin-top:2px;font-weight:400}
.empty{color:var(--faint);text-align:center;padding:26px 14px!important;font-size:12.5px}
/* ── Pills, buttons, forms ───────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--sans);
background:var(--panel2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.okb{display:inline-block;margin-left:7px;padding:1px 7px;border:1px solid var(--line);border-radius:99px;font:600 9px/1.6 var(--sans);
letter-spacing:.05em;text-transform:uppercase;color:var(--faint);vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--accent-soft);color:var(--accent-text);
padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font:600 12.5px/1.4 var(--sans);transition:filter .12s}
.btn:hover{filter:brightness(.96)}[data-theme=dark] .btn:hover{filter:brightness(1.2)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.actions.wrap{flex-wrap:wrap;width:196px;margin-left:auto}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar .note{color:var(--faint);font-size:12px}
input,select{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:8px;font-size:13px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.toolbar input{flex:1;min-width:220px}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:17px}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
.field{display:grid;gap:5px}.field label{font:650 10.5px/1.3 var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.field input{width:100%}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2);font-size:12.5px}
.check input{margin:0;padding:0;accent-color:var(--accent)}
.admin-form{grid-template-columns:1fr 1.2fr 2fr auto}
.domain-list{max-width:430px;white-space:normal;line-height:2}
/* ── Bars, misc ──────────────────────────────────────────── */
.bar{display:inline-block;vertical-align:middle;width:92px;height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar-label{display:inline-block;min-width:38px;margin-left:8px;color:var(--muted);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.json{max-width:340px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font:11px/1.5 var(--mono)}
details{margin-top:16px}summary{cursor:pointer;color:var(--muted);padding:8px 0;font-weight:550}summary:hover{color:var(--text)}
a.link{color:var(--accent-text);text-decoration:none;font-weight:550}a.link:hover{text-decoration:underline}
.domain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.domain{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.domain b{display:block;margin-bottom:7px;font-size:13px;font-weight:650;word-break:break-all;white-space:normal}
.domain .sub{min-height:34px;line-height:1.45}
footer{color:var(--faint);font-size:12px;padding:26px 2px 8px;line-height:1.6}
.mono{font-family:var(--mono);font-size:12px}
[data-spend-stats]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
/* ── Dialogs, toast ──────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(12,14,18,.42);backdrop-filter:blur(3px)}
.dialog{width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dialog.wide{width:min(820px,94vw);max-height:86vh;overflow-y:auto}
.dialog h3{margin:0 0 4px;font-size:15px;font-weight:700}
.dialog .dlg-sub{margin:0 0 12px;color:var(--muted);word-break:break-all;font-size:12.5px}
.dlg-label{display:block;margin:12px 0 0;color:var(--muted);font:650 11px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.07em}
.dlg-label input{display:block;width:100%;margin-top:5px;text-transform:none;letter-spacing:0}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.spend-tabs{display:flex;gap:6px;margin:0 0 14px}
.spend-tabs .btn{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.spend-tabs .btn.on{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.toast{position:fixed;right:16px;bottom:16px;z-index:95;max-width:430px;padding:12px 15px;border-radius:10px;border:1px solid var(--accent);
background:var(--panel);color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.28);word-break:break-word;font-size:13px}
.toast.bad{border-color:var(--bad)}.toast+.toast{bottom:76px}
/* ── Responsive ──────────────────────────────────────────── */
.burger{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.domain-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:920px){
#shell{flex-direction:column}aside{width:auto;flex:none;position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
nav{display:flex;margin:0 0 0 14px;overflow-x:auto;align-items:center}
.nav-group{display:none}.nav-item{white-space:nowrap}
.side-foot{border:0;padding:0;margin-left:auto}
.side-foot .env{display:none}
main{padding:18px 14px 50px}.page-head h1{font-size:19px}.form{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.cards,.form,.domain-grid{grid-template-columns:1fr}.card .value{font-size:23px}}
</style>
</head>
<body data-admin-panel-version="11">
<div id="app"></div>
<script>
'use strict';
const app=document.getElementById('app');
// Единственный источник правды о страницах: сайдбар строится из этого списка.
const NAV=[
  {group:'Обзор',items:[['dashboard','Сводка','▣']]},
  {group:'Инфраструктура',items:[['subs','Подписки','◍'],['system','Система','⌘']]},
  {group:'Клиенты',items:[['users','Пользователи','◉'],['accounts','Аккаунты','▤'],['business','B2B','◇']]},
  {group:'Деньги',items:[['topups','Пополнения','＄']]},
  {group:'Управление',items:[['admins','Админы','⚿'],['audit','Аудит','≡']]}
];
const validTabs=NAV.flatMap(group=>group.items.map(item=>item[0]));
const getTab=()=>validTabs.includes(location.hash.slice(1))?location.hash.slice(1):'dashboard';
let tab=getTab(),timer=null,usersCache=[],adminDomainFilter='';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
// Встроенные модалки вместо window.prompt/confirm: браузеры (или галка «блокировать диалоги»)
// молча глушат нативные диалоги, и кнопки выглядят «мёртвыми». Промис → значения полей | null.
function dialog(options){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='overlay';
  overlay.innerHTML='<div class="dialog"><h3>'+esc(options.title)+'</h3>'+(options.message?'<p class="dlg-sub">'+esc(options.message)+'</p>':'')+
    (options.fields||[]).map(field=>'<label class="dlg-label">'+esc(field.label)+'<input type="'+esc(field.type||'text')+'" name="'+esc(field.name)+'" value="'+esc(field.value||'')+'" autocomplete="off"></label>').join('')+
    '<div class="dlg-actions"><button class="btn ghost" data-dlg="cancel">Отмена</button><button class="btn '+(options.danger?'bad':'')+'" data-dlg="ok">'+esc(options.confirmLabel||'Подтвердить')+'</button></div></div>';
  const done=value=>{overlay.remove();resolve(value)};
  overlay.addEventListener('mousedown',event=>{if(event.target===overlay)done(null)});
  overlay.querySelector('[data-dlg=cancel]').onclick=()=>done(null);
  overlay.querySelector('[data-dlg=ok]').onclick=()=>{const values={};overlay.querySelectorAll('input').forEach(input=>values[input.name]=input.value);done(values)};
  overlay.addEventListener('keydown',event=>{if(event.key==='Escape')done(null);
    if(event.key==='Enter'){event.preventDefault();overlay.querySelector('[data-dlg=ok]').click()}});
  document.body.appendChild(overlay);const first=overlay.querySelector('input');(first||overlay.querySelector('[data-dlg=ok]')).focus()})}
function toast(message,kind){const note=document.createElement('div');note.className='toast'+(kind==='bad'?' bad':'');
  note.textContent=message;document.body.appendChild(note);setTimeout(()=>note.remove(),kind==='bad'?9000:5000)}
addEventListener('error',event=>toast('JS: '+event.message,'bad'));
const money=value=>'$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nanoMoney=value=>{try{let n=BigInt(String(value??'0')),neg=n<0n;if(neg)n=-n;const whole=n/1000000000n,cents=(n%1000000000n)/10000000n;
  return(neg?'−':'')+'$'+whole.toLocaleString('en-US')+'.'+cents.toString().padStart(2,'0')}catch{return'$0.00'}};
const date=(value,withTime=false)=>value?new Date(value).toLocaleString('ru-RU',withTime?{dateStyle:'short',timeStyle:'short'}:{dateStyle:'short'}):'—';
const ago=value=>{if(!value)return'—';const seconds=Math.max(0,(Date.now()-new Date(value).getTime())/1000|0);
  if(seconds<60)return'сейчас';if(seconds<3600)return(seconds/60|0)+'м';if(seconds<86400)return(seconds/3600|0)+'ч';return(seconds/86400|0)+'д'};
const pill=(value,kind='')=>'<span class="pill '+kind+'">'+esc(value)+'</span>';
const card=(label,value,hint,clickable)=>'<div class="card'+(clickable?' clickable':'')+'"'+(clickable?' data-spend-stats title="Разбивка: сутки / 7 дней / 30 дней"':'')+'><div class="label">'+esc(label)+'</div><div class="value">'+value+'</div><div class="hint">'+hint+'</div></div>';
const empty=columns=>'<tr><td colspan="'+columns+'" class="empty">данных нет</td></tr>';
const duration=seconds=>{seconds=Math.max(0,Number(seconds)||0);const days=seconds/86400|0,hours=(seconds%86400)/3600|0,minutes=(seconds%3600)/60|0;
  return days?days+'д '+hours+'ч':hours?hours+'ч '+minutes+'м':minutes+'м'};
const ratio=value=>value==null?'∞':'×'+Number(value).toLocaleString('en-US',{maximumFractionDigits:Number(value)<10?1:0});
// Русская плюрализация: plural(1,'подписка','подписки','подписок').
const plural=(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?many:b>1&&b<5?few:b===1?one:many};
const count=(n,one,few,many)=>n+' '+plural(n,one,few,many);
const windowLabel=minutes=>{minutes=Number(minutes)||0;if(!minutes)return'окно';if(minutes<60)return minutes+' мин';if(minutes<1440)return Math.round(minutes/60)+' ч';return Math.round(minutes/1440)+' д'};
function shell(title,subtitle,body,badge=''){app.innerHTML='<div id="shell"><aside><div class="brand">api<i>Token</i>.sale<small>admin</small></div><nav>'+
  NAV.map(group=>'<div class="nav-group">'+esc(group.group)+'</div>'+group.items.map(item=>
    '<a class="nav-item'+(tab===item[0]?' on':'')+'" href="#'+item[0]+'"><span class="ico">'+item[2]+'</span>'+esc(item[1])+'</a>').join('')).join('')+
  '</nav><div class="side-foot"><span class="env">production</span><button class="theme" id="theme" title="Тема">◐</button></div></aside>'+
  '<main><div class="page-head"><div><h1>'+esc(title)+'</h1>'+(subtitle?'<p class="sub">'+subtitle+'</p>':'')+'</div><div class="badge">'+badge+'</div></div>'+
  body+'</main></div>';bindCommon()}
function bindCommon(){document.querySelectorAll('[data-spend-stats]').forEach(element=>element.onclick=()=>spendStats());
  const theme=document.getElementById('theme');if(theme)theme.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;localStorage.setItem('admin-theme',next)}}
function errorPage(title,error){shell(title,'','<div class="banner bad"><span class="dot bad"></span><div><b>Не удалось загрузить данные</b><span class="muted">'+esc(error.message||error)+'</span></div></div>')}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});
  const payload=await response.json().catch(()=>({}));if(!response.ok){const message=Array.isArray(payload.message)?payload.message.join(', '):payload.message;
  throw new Error(message||('HTTP '+response.status))}return payload}
async function send(path,method,body){return api(path,{method,body:JSON.stringify(body)})}
async function refresh(){clearInterval(timer);tab=getTab();try{
  if(tab==='dashboard')await dashboard();if(tab==='subs')await subscriptions();if(tab==='system')await system();if(tab==='users')await users();
  if(tab==='accounts')await accounts();if(tab==='business')await business();if(tab==='topups')await topups();if(tab==='admins')await admins();if(tab==='audit')await audit();
}catch(error){errorPage(tab,error)}timer=setInterval(refresh,tab==='system'||tab==='subs'?3000:20000)}
addEventListener('hashchange',refresh);
const savedTheme=localStorage.getItem('admin-theme');
document.documentElement.dataset.theme=savedTheme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');

/* ── Сводка ──────────────────────────────────────────────── */
async function dashboard(){const data=await api('/admin/dashboard'),u=data.users,t=data.topups,p=data.platform;
  const sources=await Promise.all([api('/overview').catch(()=>null),api('/partner-admin/overview').catch(()=>null)]),engine=sources[0],partners=sources[1];
  const engineAccounts=engine?.accounts||[],crm=engineAccounts.find(account=>String(account.handle||'').toLowerCase()==='crm-parsing');
  const degraded=p.engine_error||!engine||!partners||!crm,state=degraded?'warn':'ok';
  const body='<div class="banner '+state+'"><span class="dot'+(degraded?' warn':'')+'"></span><div><b>'+(degraded?'Есть контуры, требующие внимания':'Все административные контуры доступны')+

// Backend требует reason в каждом действии (audit_log) — панель шлёт стандартную причину,

const PANEL_REASON='ручное действие из админ-панели';
async function creditUser(button){
  const values=await dialog({title:'Начислить баланс',message:button.dataset.email,confirmLabel:'Начислить',
    fields:[{name:'amount',label:'Сумма USD — целое число 1–99999'}]});
  if(!values)return;const value=(values.amount||'').trim(),reason=PANEL_REASON;
  if(!/^[1-9][0-9]{0,4}$/.test(value))return toast('Сумма: целое число от 1 до 99999.','bad');button.disabled=true;
  const pendingKey='admin-credit-pending:'+button.dataset.credit,payloadSignature=value+'\n'+reason;let idempotencyKey=crypto.randomUUID();
  try{const pending=JSON.parse(sessionStorage.getItem(pendingKey)||'null');if(pending?.signature===payloadSignature)idempotencyKey=pending.idempotencyKey}catch{}
  sessionStorage.setItem(pendingKey,JSON.stringify({signature:payloadSignature,idempotencyKey}));
  try{const result=await send('/admin/users/'+button.dataset.credit+'/balance-adjustments','POST',{amount_usd:value,reason,idempotency_key:idempotencyKey});
    sessionStorage.removeItem(pendingKey);toast('Готово. Новый баланс: '+money(result.balance_usd));await refresh()}
  catch(error){toast(error.message+' — idempotency key сохранён: повторите те же сумму и причину для безопасного retry.','bad');button.disabled=false}}
async function userAction(button){const action=button.dataset.action,labels={disable:'Отключить пользователя и отозвать сессии',enable:'Включить пользователя',

  bonus:'Отозвать welcome-бонус ($4). Идемпотентно: уже отозванный не спишется второй раз'};
  const values=await dialog({title:labels[action],message:button.dataset.email,confirmLabel:'Выполнить',
    danger:action==='disable'||action==='bonus'});
  if(!values)return;const reason=PANEL_REASON;button.disabled=true;
  try{let result;if(action==='disable'||action==='enable')result=await send('/admin/users/'+button.dataset.id+'/status','PATCH',{status:action==='disable'?'disabled':'active',reason});
    if(action==='sessions')result=await send('/admin/users/'+button.dataset.id+'/sessions/revoke','POST',{reason});
    if(action==='totp')result=await send('/admin/users/'+button.dataset.id+'/totp/reset','POST',{reason});

      (result.balance_usd!=null?' · новый баланс: $'+result.balance_usd+(result.idempotent_replay?' (уже был отозван ранее)':''):''));
    await refresh()}catch(error){toast(error.message,'bad');button.disabled=false}}

  shell('B2B','инвайты и индивидуальные скидки',body,pill(count(clients.length,'клиент','клиента','клиентов'),'ok'));bindBusiness()}
function bindBusiness(){const form=document.getElementById('invite');form.onsubmit=async event=>{event.preventDefault();const data=new FormData(form),button=form.querySelector('button');button.disabled=true;
  try{const result=await send('/admin/business-invites','POST',{email:data.get('email'),discountPercent:Number(data.get('discount')),expiresInDays:Number(data.get('days'))});
    await navigator.clipboard?.writeText(result.inviteUrl).catch(()=>{});toast('Инвайт создан и скопирован: '+result.inviteUrl);await refresh()}catch(error){toast(error.message,'bad');button.disabled=false}};
  document.querySelectorAll('[data-pricing]').forEach(button=>button.onclick=async()=>{
    const values=await dialog({title:'Скидка для '+button.dataset.email,confirmLabel:'Установить',
      fields:[{name:'value',label:'Скидка, % (целое 0–100)',value:button.dataset.discount}]});
    if(!values)return;const discount=Number(values.value);if(!Number.isInteger(discount)||discount<0||discount>100)return toast('Нужно целое число от 0 до 100.','bad');
    button.disabled=true;try{await send('/admin/business-users/'+button.dataset.pricing+'/pricing','PATCH',{discountPercent:discount});
    toast('Изменение поставлено в очередь синхронизации.');await refresh()}catch(error){toast(error.message,'bad');button.disabled=false}})}

/* ── Система: ёмкость флота, спрос, рекомендации ─────────── */
function systemVerdict(overview){const gap=overview.recommend.gap,h5=overview.headroom['5h'],h7=overview.headroom['7d'],target=overview.target_headroom;
  const coverage=overview.coverage['7d'],cooling=overview.supply.health.cooling,total=overview.subs,critical=value=>value!=null&&value<1,tight=value=>value!=null&&value<target;
  if(critical(h5)||critical(h7)||(total>0&&cooling>=total))return{kind:'bad',title:'Дефицит ёмкости — нужно +'+Math.max(1,gap)+' подписок',
    detail:'headroom 5h '+ratio(h5)+' / 7d '+ratio(h7)+' · потребление близко к потолку'};
  if(gap>0||tight(h5)||tight(h7)||coverage>1||cooling>0){const why=gap>0?'рекомендуется +'+gap+' подписок':tight(h5)||tight(h7)?'запас ниже цели ×'+target:
    coverage>1?'балансы клиентов ×'+coverage+' к ёмкости':cooling+' подписок остывают';return{kind:'warn',title:'Под контролем, но нужно внимание',detail:why+' · headroom 5h '+ratio(h5)+' / 7d '+ratio(h7)}}
  return{kind:'ok',title:'Запаса ёмкости хватает',detail:'headroom 5h '+ratio(h5)+' / 7d '+ratio(h7)+' · подписок '+total+', цель ×'+target+' выдержана'}}
async function system(){const result=await Promise.all([api('/overview'),api('/capacity').catch(()=>null)]),overview=result[0],capacity=result[1];
  const supply=overview.supply,health=supply.health,demand=overview.demand,recommend=overview.recommend,verdict=systemVerdict(overview),mult=overview.ref_mult;
  const horizonCards=[['7d','7 дней','7d'],['1d','1 день',null],['5h','5 часов (burst)','5h']].map(item=>{const available=supply.avail_usd[item[0]]||0,head=item[2]?overview.headroom[item[2]]:null;
    return card('доступно · '+item[1],money(available),'клиентам ×'+mult+' = '+money(available*mult)+(item[2]?' · запас '+ratio(head):''))}).join('');
  const accountRows=(overview.accounts||[]).map(account=>'<tr><td class="left mono muted">'+esc(account.account)+'</td><td class="left"><b>'+esc(account.handle||'—')+'</b>'+okBadge(account.handle)+'</td><td>'+
    pill(account.status,account.status==='active'?'ok':'bad')+'</td><td><b>'+money(account.balance_usd)+'</b></td><td><b>'+money(account.spent_usd)+'</b></td><td>×'+esc(account.mult)+'</td></tr>').join('');
  const body='<div class="banner '+verdict.kind+'"><span class="dot'+(verdict.kind==='ok'?'':' '+verdict.kind)+'"></span><div><b>'+esc(verdict.title)+'</b><span class="muted">'+esc(verdict.detail)+'</span></div></div>'+
    '<div class="sect"><h2>Предложение — real-API USD</h2></div><div class="cards">'+horizonCards+card('балансы клиентов',money(demand.balance_usd),'резерв '+money(demand.reserved_usd)+' · coverage 7d ×'+overview.coverage['7d'])+
    '</div><div class="sect"><h2>Флот и спрос</h2></div><div class="cards">'+card('подписки',overview.subs,health.healthy+' живых · '+health.cooling+' cooling')+
    card('утилизация средняя',Math.round(supply.util['7d']*100)+'%','7d · '+Math.round(supply.util['5h']*100)+'% за 5h')+
    card('всего потрачено',money(demand.spent_usd),'потенциальный спрос '+money(demand.potential_realapi_usd)+' real-API',true)+
    card('рекомендация',recommend.gap>0?'+'+recommend.gap:'ok','нужно '+recommend.subs_needed+' подписок · есть '+overview.subs)+'</div>'+
    '<div class="sect"><h2>Подписки</h2><span class="sect-sub">живой статус флота</span></div>'+
    '<div class="banner ok" style="margin-bottom:0"><span class="dot"></span><div><b>Детальный статус подписок — на отдельной странице</b><span class="muted"><a class="link" href="#subs">Открыть «Подписки»</a> — окна 5ч/7д, cooling, lifecycle и прокси по каждой подписке Claude и GPT.</span></div></div>'+
    '<div class="sect"><h2>Аккаунты движка · '+(overview.accounts||[]).length+'</h2></div><div class="tcard"><div class="tscroll"><table><thead><tr><th class="left">account</th><th class="left">handle</th><th>статус</th><th>баланс</th><th><span data-spend-stats title="Разбивка: сутки / 7 дней / 30 дней">потрачено</span></th><th>множитель</th></tr></thead><tbody>'+
    (accountRows||empty(6))+'</tbody></table></div></div><footer>Обновление каждые 3с · «доступно» учитывает сбросы окон · «запас» = доступно ÷ текущее потребление · клиентам ×'+mult+'</footer>';
  shell('Система','ёмкость, спрос и рекомендации по флоту',body,pill(count(overview.subs,'подписка','подписки','подписок'),verdict.kind))}

/* ── Аудит ───────────────────────────────────────────────── */
async function audit(){const rows=(await api('/admin/audit?limit=200')).rows||[],bodyRows=rows.map(item=>'<tr><td>'+date(item.created_at,true)+'</td><td class="left">'+
  pill(item.action,item.action.startsWith('admin.')?'warn':'')+'</td><td class="left">'+esc(item.actor_type)+'<div class="sub mono">'+esc(item.actor_id||'system')+'</div></td><td class="left">'+
  esc(item.target_type)+' · '+esc(item.target_id)+'</td><td class="left"><div class="json" title="'+esc(JSON.stringify(item.metadata||{}))+'">'+esc(JSON.stringify(item.metadata||{}))+'</div></td></tr>').join('');
  shell('Аудит','operator/user/provider события и причины действий','<div class="tcard"><div class="tscroll"><table><thead><tr><th>время</th><th class="left">действие</th><th class="left">актор</th>'+
  '<th class="left">цель</th><th class="left">метаданные</th></tr></thead><tbody>'+(bodyRows||empty(5))+'</tbody></table></div></div><footer>Последние 200 событий. Секреты и полные API-ключи не записываются.</footer>',pill(count(rows.length,'событие','события','событий'),'ok'))}
refresh();
</script>
