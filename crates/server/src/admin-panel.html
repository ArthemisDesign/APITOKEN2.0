<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>apiToken.sale · admin</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f8f9fb;--line:#e2e6ec;--line2:#edf0f4;--text:#161a22;--muted:#68707e;--faint:#98a0ac;
--accent:#3f66e0;--accent-soft:#e9efff;--accent-text:#2f4fc4;--ok:#15803d;--ok-soft:#e4f5eb;--warn:#b45309;--warn-soft:#fcf0dd;
--bad:#c92a2a;--bad-soft:#fceaea;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.04);
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
[data-theme=dark]{--bg:#0c0e11;--panel:#14171c;--panel2:#1a1e24;--line:#242a33;--line2:#1e242c;--text:#e5e9f0;--muted:#97a0ad;--faint:#646e7c;
--accent:#8aa5ff;--accent-soft:#1a2440;--accent-text:#a5baff;--ok:#4ade80;--ok-soft:#122a1b;--warn:#fbbf24;--warn-soft:#2c2210;
--bad:#f87171;--bad-soft:#2e1515;--shadow:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}
button,input,select{font:inherit;color:inherit}::selection{background:var(--accent-soft)}
#shell{display:flex;min-height:100vh}
/* ── Sidebar ─────────────────────────────────────────────── */
aside{width:238px;flex:0 0 238px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
display:flex;flex-direction:column;padding:20px 14px 14px;z-index:20}
.brand{font:800 17px/1.2 var(--sans);letter-spacing:-.02em;padding:0 10px;white-space:nowrap}
.brand i{color:var(--accent);font-style:normal}
.brand small{display:block;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
nav{flex:1;margin-top:22px;overflow-y:auto}
.nav-group{font:700 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:550;cursor:pointer;
text-decoration:none;margin:1px 0;transition:background .12s,color .12s}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.nav-item .ico{width:17px;text-align:center;font-size:13px;opacity:.85}
.side-foot{border-top:1px solid var(--line2);padding-top:12px;display:flex;align-items:center;gap:8px}
.side-foot .env{font:600 10px/1.4 var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.theme{margin-left:auto;border:1px solid var(--line);background:var(--panel2);width:34px;height:30px;border-radius:8px;cursor:pointer}
.theme:hover{border-color:var(--accent)}
/* ── Main ────────────────────────────────────────────────── */
main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1440px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:0}
.page-head .sub{color:var(--muted);margin:3px 0 0;font-size:13px}
.page-head .badge{margin-left:auto}
.sect{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.sect h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0}
.sect .sect-sub{color:var(--faint);font-size:12px}
/* ── Banners ─────────────────────────────────────────────── */
.banner{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
box-shadow:var(--shadow);margin-bottom:14px}
.banner .dot{margin-top:6px}
.banner b{display:block;font-size:14px;font-weight:650}
.banner .muted{font-size:12.5px}
.banner.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.banner.ok b{color:var(--ok)}.banner.warn b{color:var(--warn)}.banner.bad b{color:var(--bad)}
.banner.ok .muted,.banner.warn .muted,.banner.bad .muted{color:var(--text);opacity:.75}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 9px}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.off{background:var(--faint)}
/* ── Stat cards ──────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card .label{font:650 10.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.card .value{font:750 26px/1.15 var(--sans);letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hint{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.clickable{cursor:pointer}.card.clickable:hover{border-color:var(--accent)}
/* ── Tables ──────────────────────────────────────────────── */
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:4px}
.tscroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
th{font:650 10.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);background:var(--panel2);
position:sticky;top:0;z-index:1;text-align:right}
tbody tr{transition:background .1s}tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
th.left,td.left{text-align:left}
td b{font-weight:650}
.sub{font-size:11.5px;color:var(--faint);margin-top:2px;font-weight:400}
.empty{color:var(--faint);text-align:center;padding:26px 14px!important;font-size:12.5px}
/* ── Pills, buttons, forms ───────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--sans);
background:var(--panel2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.okb{display:inline-block;margin-left:7px;padding:1px 7px;border:1px solid var(--line);border-radius:99px;font:600 9px/1.6 var(--sans);
letter-spacing:.05em;text-transform:uppercase;color:var(--faint);vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--accent-soft);color:var(--accent-text);
padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font:600 12.5px/1.4 var(--sans);transition:filter .12s}
.btn:hover{filter:brightness(.96)}[data-theme=dark] .btn:hover{filter:brightness(1.2)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.actions.wrap{flex-wrap:wrap;width:196px;margin-left:auto}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar .note{color:var(--faint);font-size:12px}
input,select{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:8px;font-size:13px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.toolbar input{flex:1;min-width:220px}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:17px}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
.field{display:grid;gap:5px}.field label{font:650 10.5px/1.3 var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.field input{width:100%}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.check{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2);font-size:12.5px}
.check input{margin:0;padding:0;accent-color:var(--accent)}
.admin-form{grid-template-columns:1fr 1.2fr 2fr auto}
.domain-list{max-width:430px;white-space:normal;line-height:2}
/* ── Bars, misc ──────────────────────────────────────────── */
.bar{display:inline-block;vertical-align:middle;width:92px;height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.bar-label{display:inline-block;min-width:38px;margin-left:8px;color:var(--muted);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.json{max-width:340px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font:11px/1.5 var(--mono)}
details{margin-top:16px}summary{cursor:pointer;color:var(--muted);padding:8px 0;font-weight:550}summary:hover{color:var(--text)}
a.link{color:var(--accent-text);text-decoration:none;font-weight:550}a.link:hover{text-decoration:underline}
.domain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.domain{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.domain b{display:block;margin-bottom:7px;font-size:13px;font-weight:650;word-break:break-all;white-space:normal}
.domain .sub{min-height:34px;line-height:1.45}
footer{color:var(--faint);font-size:12px;padding:26px 2px 8px;line-height:1.6}
.mono{font-family:var(--mono);font-size:12px}
[data-spend-stats]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
/* ── Dialogs, toast ──────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(12,14,18,.42);backdrop-filter:blur(3px)}
.dialog{width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dialog.wide{width:min(820px,94vw);max-height:86vh;overflow-y:auto}
.dialog h3{margin:0 0 4px;font-size:15px;font-weight:700}
.dialog .dlg-sub{margin:0 0 12px;color:var(--muted);word-break:break-all;font-size:12.5px}
.dlg-label{display:block;margin:12px 0 0;color:var(--muted);font:650 11px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.07em}
.dlg-label input{display:block;width:100%;margin-top:5px;text-transform:none;letter-spacing:0}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.spend-tabs{display:flex;gap:6px;margin:0 0 14px}
.spend-tabs .btn{background:var(--panel2);color:var(--muted);border-color:var(--line)}
.spend-tabs .btn.on{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.toast{position:fixed;right:16px;bottom:16px;z-index:95;display:flex;align-items:flex-start;gap:10px;max-width:430px;padding:12px 15px;border-radius:10px;border:1px solid var(--accent);
background:var(--panel);color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.28);word-break:break-word;font-size:13px}
.toast>span{flex:1}.toast.bad{border-color:var(--bad)}.toast+.toast{bottom:76px}
.error-center{position:fixed;right:16px;top:16px;z-index:100;display:grid;gap:10px;width:min(440px,calc(100vw - 32px))}
.error-note{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid var(--bad);
border-radius:12px;background:var(--panel);box-shadow:0 14px 38px rgba(0,0,0,.24)}
.error-note b{display:block;color:var(--bad);font-size:13px}.error-note p{margin:2px 0 0;color:var(--muted);font-size:12px;word-break:break-word}
.error-note .error-actions{display:flex;gap:6px}.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.loading-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.skeleton{height:104px;border:1px solid var(--line);border-radius:12px;
background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:pulse 1.2s ease-in-out infinite}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:12px;color:var(--muted);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes pulse{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
/* ── Responsive ──────────────────────────────────────────── */
.burger{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.domain-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:920px){
#shell{flex-direction:column}aside{width:auto;flex:none;position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
nav{display:flex;margin:0 0 0 14px;overflow-x:auto;align-items:center}
.nav-group{display:none}.nav-item{white-space:nowrap}
.side-foot{border:0;padding:0;margin-left:auto}
.side-foot .env{display:none}
main{padding:18px 14px 50px}.page-head h1{font-size:19px}.form{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.cards,.form,.domain-grid{grid-template-columns:1fr}.card .value{font-size:23px}}
</style>
</head>
<body data-admin-panel-version="21">
<div id="app"></div>
<div id="error-center" class="error-center" aria-live="polite"></div>
<script src="/admin-panel.js" defer></script>
</body>
</html>
