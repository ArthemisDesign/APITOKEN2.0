<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>apiToken.sale · admin</title>
<style>
:root{--bg:#fff;--soft:#f5f5f4;--card:#fff;--line:#dededb;--text:#0a0a0a;--muted:#6b6a65;
--blue:#3767f0;--blue-bg:#eef2ff;--green:#14804a;--green-bg:#edf9f2;--orange:#a56300;
--orange-bg:#fff7e8;--red:#b42318;--red-bg:#fff0ef;--shadow:0 8px 30px rgba(10,10,10,.06);
--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
[data-theme=dark]{--bg:#0a0a0a;--soft:#151515;--card:#101010;--line:#292929;--text:#fff;--muted:#aaa;
--blue:#7192ff;--blue-bg:#111936;--green:#55d98a;--green-bg:#102419;--orange:#ffc15c;
--orange-bg:#281d09;--red:#ff8279;--red-bg:#2c1110;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--mono);
background-image:linear-gradient(rgba(120,120,120,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(120,120,120,.035) 1px,transparent 1px);
background-size:44px 44px}button,input,select{font:inherit}header{height:62px;display:flex;align-items:center;gap:18px;
padding:0 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);
backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}.brand{font-size:16px;font-weight:800;white-space:nowrap}
.brand i{color:var(--blue);font-style:normal}.brand small{font-size:10px;color:var(--muted);font-weight:500;margin-left:10px;
letter-spacing:.1em;text-transform:uppercase}.tabs{height:100%;display:flex;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;
background:none;color:var(--muted);padding:0 12px;cursor:pointer;white-space:nowrap}.tabs button:hover,.tabs button.on{color:var(--text)}
.tabs button.on{border-bottom-color:var(--blue);font-weight:700}.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.theme{border:1px solid var(--line);background:var(--card);color:var(--text);width:34px;height:32px;cursor:pointer}
main{max-width:1320px;margin:auto;padding:24px}h1{font-size:20px;margin:0}h2{font-size:10px;text-transform:uppercase;
letter-spacing:.13em;color:var(--muted);margin:28px 0 10px}.lead{color:var(--muted);margin:4px 0 20px}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);
margin-bottom:20px}.banner.ok{border-color:var(--green);background:var(--green-bg)}.banner.warn{border-color:var(--orange);background:var(--orange-bg)}
.banner.bad{border-color:var(--red);background:var(--red-bg)}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.warn .dot,.dot.warn{background:var(--orange)}.bad .dot,.dot.bad{background:var(--red)}.banner b{display:block;font-size:14px}
.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);
border-radius:7px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}.card{padding:18px;border-right:1px solid var(--line)}
.card:nth-child(4n){border-right:0}.card:nth-child(n+5){border-top:1px solid var(--line)}.label{font-size:10px;text-transform:uppercase;
letter-spacing:.08em;color:var(--muted)}.value{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.04em}.hint{color:var(--muted);font-size:11px;margin-top:4px}
.panel,.table{border:1px solid var(--line);border-radius:7px;background:var(--card);box-shadow:var(--shadow);margin-bottom:16px}
.panel{padding:17px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:10px;
text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);font-weight:600}tr:last-child td{border:0}
tbody tr:hover{background:var(--blue-bg)}th.left,td.left{text-align:left}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:1px;font-size:10px;color:var(--muted)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.warn{color:var(--orange);border-color:var(--orange)}
.pill.bad{color:var(--red);border-color:var(--red)}.btn{border:1px solid var(--blue);background:var(--blue-bg);color:var(--blue);
padding:5px 9px;border-radius:4px;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--blue);color:#fff}
.btn.warn{color:var(--orange);border-color:var(--orange);background:var(--orange-bg)}.btn.bad{color:var(--red);border-color:var(--red);background:var(--red-bg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:5px;justify-content:flex-end}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 10px;border-radius:4px}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}.toolbar input{flex:1;min-width:220px}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}.field{display:grid;gap:4px}
.field label{font-size:10px;color:var(--muted);text-transform:uppercase}.json{max-width:340px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:10px}
.checks{display:flex;flex-wrap:wrap;gap:7px}.check{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--soft)}
.check input{margin:0;padding:0}.admin-form{grid-template-columns:1fr 1.2fr 2fr auto}.domain-list{max-width:420px;white-space:normal}
footer{text-align:center;color:var(--muted);font-size:10px;padding:24px}.empty{text-align:left;color:var(--muted)}
.bar{display:inline-block;vertical-align:middle;width:86px;height:6px;border-radius:4px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue)}.bar i.warn{background:var(--orange)}.bar i.bad{background:var(--red)}
.bar-label{display:inline-block;min-width:38px;margin-left:6px;color:var(--muted);font-size:10px;text-align:right}
details{margin-top:14px}summary{cursor:pointer;color:var(--muted);padding:6px 0}summary:hover{color:var(--text)}
a.link{color:var(--blue);text-decoration:none}a.link:hover{text-decoration:underline}.domain-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.domain{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:14px}.domain b{display:block;margin-bottom:4px}.domain .sub{min-height:32px}
@media(max-width:960px){header{padding:0 10px;gap:8px}.brand small,.right .pill{display:none}.tabs button{padding:0 8px}.cards,.domain-grid{grid-template-columns:repeat(2,1fr)}
.card:nth-child(2n){border-right:0}.card:nth-child(n+3){border-top:1px solid var(--line)}.form{grid-template-columns:1fr 1fr}}
@media(max-width:600px){main{padding:16px 10px}.brand{font-size:13px}.right{display:none}.cards,.form,.domain-grid{grid-template-columns:1fr}
.card{border-right:0!important;border-top:1px solid var(--line)}.card:first-child{border-top:0}}
.overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(2px)}
.dialog{width:min(430px,92vw);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.dialog.wide{width:min(760px,94vw);max-height:86vh;overflow-y:auto}
.spend-tabs{display:flex;gap:6px;margin:0 0 10px}.spend-tabs .btn.on{border-color:var(--accent);color:var(--accent)}
[data-spend-stats]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.dialog h3{margin:0 0 4px;font-size:14px}.dialog .dlg-sub{margin:0 0 12px;color:var(--muted);word-break:break-all}
.dlg-label{display:block;margin:10px 0 0;color:var(--muted)}.dlg-label input{display:block;width:100%;margin-top:4px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;right:16px;bottom:16px;z-index:95;max-width:420px;padding:10px 14px;border-radius:6px;border:1px solid var(--blue);background:var(--card);color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.3);word-break:break-word}
.toast.bad{border-color:var(--red)}.toast+.toast{bottom:70px}
</style>
</head>
<body data-admin-panel-version="7">
<div id="app"></div>
<script>
const app=document.getElementById('app');
const validTabs=['dashboard','admins','accounts','users','topups','business','system','audit'];
const getTab=()=>validTabs.includes(location.hash.slice(1))?location.hash.slice(1):'dashboard';
let tab=getTab(),timer=null,usersCache=[],adminDomainFilter='';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
// Встроенные модалки вместо window.prompt/confirm: браузеры (или галка «блокировать диалоги»)
// молча глушат нативные диалоги, и кнопки выглядят «мёртвыми». Промис → значения полей | null.
function dialog(options){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='overlay';
  overlay.innerHTML='<div class="dialog"><h3>'+esc(options.title)+'</h3>'+(options.message?'<p class="dlg-sub">'+esc(options.message)+'</p>':'')+
    (options.fields||[]).map(field=>'<label class="dlg-label">'+esc(field.label)+'<input type="'+esc(field.type||'text')+'" name="'+esc(field.name)+'" value="'+esc(field.value||'')+'" autocomplete="off"></label>').join('')+
    '<div class="dlg-actions"><button class="btn" data-dlg="cancel">Отмена</button><button class="btn '+(options.danger?'bad':'')+'" data-dlg="ok">'+esc(options.confirmLabel||'Подтвердить')+'</button></div></div>';
  const done=value=>{overlay.remove();resolve(value)};
  overlay.addEventListener('mousedown',event=>{if(event.target===overlay)done(null)});
  overlay.querySelector('[data-dlg=cancel]').onclick=()=>done(null);
  overlay.querySelector('[data-dlg=ok]').onclick=()=>{const values={};overlay.querySelectorAll('input').forEach(input=>values[input.name]=input.value);done(values)};
  overlay.addEventListener('keydown',event=>{if(event.key==='Escape')done(null);
    if(event.key==='Enter'){event.preventDefault();overlay.querySelector('[data-dlg=ok]').click()}});
  document.body.appendChild(overlay);const first=overlay.querySelector('input');(first||overlay.querySelector('[data-dlg=ok]')).focus()})}
function toast(message,kind){const note=document.createElement('div');note.className='toast'+(kind==='bad'?' bad':'');
  note.textContent=message;document.body.appendChild(note);setTimeout(()=>note.remove(),kind==='bad'?9000:5000)}
addEventListener('error',event=>toast('JS: '+event.message,'bad'));
const money=value=>'$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nanoMoney=value=>{try{let n=BigInt(String(value??'0')),neg=n<0n;if(neg)n=-n;const whole=n/1000000000n,cents=(n%1000000000n)/10000000n;
  return(neg?'−':'')+'$'+whole.toLocaleString('en-US')+'.'+cents.toString().padStart(2,'0')}catch{return'$0.00'}};
const date=(value,withTime=false)=>value?new Date(value).toLocaleString('ru-RU',withTime?{dateStyle:'short',timeStyle:'short'}:{dateStyle:'short'}):'—';
const ago=value=>{if(!value)return'—';const seconds=Math.max(0,(Date.now()-new Date(value).getTime())/1000|0);
  if(seconds<60)return'сейчас';if(seconds<3600)return(seconds/60|0)+'м';if(seconds<86400)return(seconds/3600|0)+'ч';return(seconds/86400|0)+'д'};
const pill=(value,kind='')=>'<span class="pill '+kind+'">'+esc(value)+'</span>';
const card=(label,value,hint)=>'<div class="card"><div class="label">'+esc(label)+'</div><div class="value">'+value+'</div><div class="hint">'+hint+'</div></div>';
const empty=columns=>'<tr><td colspan="'+columns+'" class="empty">данных нет</td></tr>';
const duration=seconds=>{seconds=Math.max(0,Number(seconds)||0);const days=seconds/86400|0,hours=(seconds%86400)/3600|0,minutes=(seconds%3600)/60|0;
  return days?days+'д '+hours+'ч':hours?hours+'ч '+minutes+'м':minutes+'м'};
const ratio=value=>value==null?'∞':'×'+Number(value).toLocaleString('en-US',{maximumFractionDigits:Number(value)<10?1:0});
function header(title,badge=''){return '<header><div class="brand">api<i>Token</i>.sale<small>admin · '+esc(title)+'</small></div><nav class="tabs">'+
  [['dashboard','Сводка'],['admins','Админы'],['accounts','Аккаунты'],['users','Пользователи'],['topups','Пополнения'],['business','B2B'],['system','Система'],['audit','Аудит']]
  .map(item=>'<button data-tab="'+item[0]+'" class="'+(tab===item[0]?'on':'')+'">'+item[1]+'</button>').join('')+
  '</nav><div class="right">'+badge+'<button class="theme" id="theme">◐</button></div></header>'}
function page(title,body,badge=''){app.innerHTML=header(title,badge)+'<main>'+body+'</main>';bindCommon()}
function bindCommon(){document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{location.hash=button.dataset.tab});
  document.querySelectorAll('[data-spend-stats]').forEach(element=>element.onclick=()=>spendStats());
  const theme=document.getElementById('theme');if(theme)theme.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;localStorage.setItem('admin-theme',next)}}
function errorPage(title,error){page(title,'<div class="banner bad"><span class="dot"></span><div><b>Не удалось загрузить данные</b><span class="muted">'+esc(error.message||error)+'</span></div></div>')}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});
  const payload=await response.json().catch(()=>({}));if(!response.ok){const message=Array.isArray(payload.message)?payload.message.join(', '):payload.message;
  throw new Error(message||('HTTP '+response.status))}return payload}
async function send(path,method,body){return api(path,{method,body:JSON.stringify(body)})}
async function refresh(){clearInterval(timer);tab=getTab();try{
  if(tab==='dashboard')await dashboard();if(tab==='admins')await admins();if(tab==='accounts')await accounts();if(tab==='users')await users();if(tab==='topups')await topups();
  if(tab==='business')await business();if(tab==='system')await system();if(tab==='audit')await audit();
}catch(error){errorPage(tab,error)}timer=setInterval(refresh,tab==='system'?3000:20000)}
addEventListener('hashchange',refresh);
const savedTheme=localStorage.getItem('admin-theme');
document.documentElement.dataset.theme=savedTheme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');

async function dashboard(){const data=await api('/admin/dashboard'),u=data.users,t=data.topups,p=data.platform;
  const sources=await Promise.all([api('/overview').catch(()=>null),api('/partner-admin/overview').catch(()=>null)]),engine=sources[0],partners=sources[1];
  const engineAccounts=engine?.accounts||[],crm=engineAccounts.find(account=>String(account.handle||'').toLowerCase()==='crm-parsing');
  const degraded=p.engine_error||!engine||!partners||!crm,state=degraded?'warn':'ok';
  const body='<div class="banner '+state+'"><span class="dot"></span><div><b>'+(degraded?'Есть контуры, требующие внимания':'Все административные контуры доступны')+
    '</b><span class="muted">обновлено '+date(data.generated_at,true)+' · сессий '+p.active_sessions+' · engine errors '+p.engine_error+
    ' · CRM '+(crm?esc(crm.status):'account missing')+'</span></div></div>'+
    '<h2>Аккаунты по контурам</h2><div class="cards">'+
    card('commerce accounts',u.total,u.active+' активны · '+u.disabled+' отключены')+
    card('engine accounts',engine?engineAccounts.length:'—',engine?engineAccounts.filter(account=>account.status==='active').length+' active':'источник недоступен')+
    card('partner accounts',partners?partners.partners:'—',partners?partners.activePartners+' active · '+partners.referredUsers+' referrals':'источник недоступен')+
    card('CRM & Parsing',crm?esc(crm.status):'не найден',crm?esc(crm.handle)+' · '+money(crm.balance_usd):'нужен engine account crm-parsing')+'</div>'+
    '<h2>Клиенты и регистрации</h2><div class="cards">'+
    card('всего клиентов',u.total,u.active+' активны · '+u.disabled+' отключены')+
    card('OAuth-регистрации',u.registered_oauth,'сейчас OAuth-only '+u.oauth_only+' · hybrid '+u.hybrid)+
    card('обычная регистрация',u.registered_password,'сейчас password-only '+u.password_only)+
    card('новые за 30 дней',u.registered_30d,'24ч '+u.registered_24h+' · active 7д '+u.active_7d)+'</div>'+
    '<h2>Деньги и пополнения</h2><div class="cards">'+
    card('успешные пополнения',t.paid_count,t.paid_users+' платящих клиентов')+
    card('пополнено всего',money(t.paid_usd),'30д '+money(t.paid_30d_usd)+' · '+t.paid_30d_count+' шт.')+
    card('ручные начисления',t.manual_count,money(t.manual_usd)+' · 30д '+t.manual_30d_count)+
    card('ожидают оплаты',t.pending_checkouts,'ошибок 30д '+t.failed_30d+' · возвратов '+t.refunded_count)+'</div>'+
    '<h2>Платформа</h2><div class="cards">'+card('API-ключи',p.active_api_keys,'активны из '+p.total_api_keys)+
    card('B2C / B2B',p.b2c_users+' / '+p.b2b_users,'клиенты по типу тарифа')+
    card('engine active',p.engine_active,'pending '+p.engine_pending+' · disabled '+p.engine_disabled)+
    card('защищены 2FA',u.totp,'email подтверждено '+u.verified)+'</div>'+
    '<footer>Подробный единый список engine, commerce, partner и CRM-аккаунтов — во вкладке «Аккаунты».</footer>';
  page('сводка',body,pill(u.active+' active','ok'))}

async function admins(){const suffix=adminDomainFilter?'?domain='+encodeURIComponent(adminDomainFilter):'',result=await Promise.all([
  api('/admin/admin-accounts'+suffix),api('/admin/admin-accounts/domains')]),data=result[0],directory=result[1],accounts=data.accounts||[],domains=directory.domains||[];
  const options='<option value="">все управляемые домены</option>'+domains.map(item=>'<option value="'+esc(item.domain)+'" '+(adminDomainFilter===item.domain?'selected':'')+'>'+esc(item.domain)+'</option>').join('');
  const checks=domains.map((item,index)=>'<label class="check"><input type="checkbox" name="domains" value="'+esc(item.domain)+'" '+(index===0?'checked':'')+'>'+esc(item.label)+'</label>').join('');
  const rows=accounts.map(account=>{const self=account.id===data.current_account_id,domainPills=(account.domains||[]).map(domain=>pill(domain,domain==='admin.apitoken.sale'?'ok':'')).join(' ');
    const actions='<button class="btn" data-admin-action="password" data-id="'+esc(account.id)+'" data-username="'+esc(account.username)+'" data-self="'+(self?'1':'0')+'">пароль</button>'+
      '<button class="btn" data-admin-action="domains" data-id="'+esc(account.id)+'" data-username="'+esc(account.username)+'" data-domains="'+esc((account.domains||[]).join(','))+'">домены</button>'+
      '<button class="btn '+(account.status==='active'?'bad':'')+'" data-admin-action="status" data-id="'+esc(account.id)+'" data-username="'+esc(account.username)+'" data-status="'+esc(account.status)+'">'+(account.status==='active'?'отключить':'включить')+'</button>';
    return '<tr><td class="left"><b>'+esc(account.username)+'</b>'+(self?' '+pill('вы','ok'):'')+'<div class="sub">'+esc(account.id)+'</div></td><td class="left domain-list">'+domainPills+
      '</td><td>'+pill(account.status,account.status==='active'?'ok':'bad')+'</td><td>'+date(account.password_changed_at,true)+'</td><td>'+date(account.created_at,true)+'</td><td><div class="actions">'+actions+'</div></td></tr>'}).join('');
  const external=(directory.external_domains||[]).map(item=>esc(item.domain)+' использует '+esc(item.account_system)).join(' · ');
  const body='<div class="banner ok"><span class="dot"></span><div><b>Центральное управление администраторами</b><span class="muted">Один логин можно назначить на один или несколько внутренних доменов. '+external+'.</span></div></div>'+
    '<h2>Новый администратор</h2><form id="admin-create" class="panel form admin-form"><div class="field"><label>Логин</label><input name="username" required maxlength="80" pattern="[A-Za-z0-9._@-]+" autocomplete="off" placeholder="new.admin"></div>'+
    '<div class="field"><label>Пароль (минимум 8)</label><input name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password"></div><div class="field"><label>Доступ к доменам</label><div class="checks">'+checks+'</div></div><button class="btn" type="submit">создать</button></form>'+
    '<h2>Администраторы</h2><div class="toolbar"><select id="admin-domain">'+options+'</select><span class="muted">Точный фильтр по домену · найдено '+accounts.length+'</span></div>'+
    '<div class="table"><div class="scroll"><table><thead><tr><th class="left">администратор</th><th class="left">домены</th><th>статус</th><th>пароль изменён</th><th>создан</th><th>действия</th></tr></thead><tbody>'+(rows||empty(6))+'</tbody></table></div></div>'+
    '<footer>Пароли хранятся только как Argon2id-хеши. Нельзя отключить или лишить main-admin доступа последнего активного администратора.</footer>';
  page('администраторы',body,pill(accounts.filter(account=>account.status==='active').length+' active','ok'));bindAdmins(domains)}
function bindAdmins(domains){const select=document.getElementById('admin-domain');select.onchange=()=>{adminDomainFilter=select.value;admins().catch(error=>errorPage('администраторы',error))};

// Backend требует reason в каждом действии (audit_log) — панель шлёт стандартную причину,
// чтобы не заставлять оператора печатать её на каждый клик.
const PANEL_REASON='ручное действие из админ-панели';
async function creditUser(button){
  const values=await dialog({title:'Начислить баланс',message:button.dataset.email,confirmLabel:'Начислить',
    fields:[{name:'amount',label:'Сумма USD — целое число 1–99999'}]});
  if(!values)return;const value=(values.amount||'').trim(),reason=PANEL_REASON;
  if(!/^[1-9][0-9]{0,4}$/.test(value))return toast('Сумма: целое число от 1 до 99999.','bad');button.disabled=true;
  const pendingKey='admin-credit-pending:'+button.dataset.credit,payloadSignature=value+'\n'+reason;let idempotencyKey=crypto.randomUUID();
  try{const pending=JSON.parse(sessionStorage.getItem(pendingKey)||'null');if(pending?.signature===payloadSignature)idempotencyKey=pending.idempotencyKey}catch{}
  sessionStorage.setItem(pendingKey,JSON.stringify({signature:payloadSignature,idempotencyKey}));
  try{const result=await send('/admin/users/'+button.dataset.credit+'/balance-adjustments','POST',{amount_usd:value,reason,idempotency_key:idempotencyKey});
    sessionStorage.removeItem(pendingKey);toast('Готово. Новый баланс: '+money(result.balance_usd));await refresh()}
  catch(error){toast(error.message+' — idempotency key сохранён: повторите те же сумму и причину для безопасного retry.','bad');button.disabled=false}}

    '<h2>B2B-клиенты</h2><div class="table"><div class="scroll"><table><thead><tr><th class="left">клиент</th><th>скидка</th><th>баланс</th><th>engine</th><th></th></tr></thead><tbody>'+
    (clientRows||empty(5))+'</tbody></table></div></div><h2>Последние инвайты</h2><div class="table"><div class="scroll"><table><thead><tr><th class="left">email</th>'+
    '<th>скидка</th><th>статус</th><th>истекает</th><th>использован</th></tr></thead><tbody>'+(inviteRows||empty(5))+'</tbody></table></div></div>';
  page('B2B',body,pill(clients.length+' клиентов','ok'));bindBusiness()}
function bindBusiness(){const form=document.getElementById('invite');form.onsubmit=async event=>{event.preventDefault();const data=new FormData(form),button=form.querySelector('button');button.disabled=true;
  try{const result=await send('/admin/business-invites','POST',{email:data.get('email'),discountPercent:Number(data.get('discount')),expiresInDays:Number(data.get('days'))});
    await navigator.clipboard?.writeText(result.inviteUrl).catch(()=>{});toast('Инвайт создан и скопирован: '+result.inviteUrl);await refresh()}catch(error){toast(error.message,'bad');button.disabled=false}};
  document.querySelectorAll('[data-pricing]').forEach(button=>button.onclick=async()=>{
    const values=await dialog({title:'Скидка для '+button.dataset.email,confirmLabel:'Установить',
      fields:[{name:'value',label:'Скидка, % (целое 0–100)',value:button.dataset.discount}]});
    if(!values)return;const discount=Number(values.value);if(!Number.isInteger(discount)||discount<0||discount>100)return toast('Нужно целое число от 0 до 100.','bad');
    button.disabled=true;try{await send('/admin/business-users/'+button.dataset.pricing+'/pricing','PATCH',{discountPercent:discount});
    toast('Изменение поставлено в очередь синхронизации.');await refresh()}catch(error){toast(error.message,'bad');button.disabled=false}})}

function capacityBar(util){const percent=Math.min(100,Math.max(0,Math.round((Number(util)||0)*100))),kind=percent>=95?'bad':percent>=70?'warn':'';
  return'<span class="bar"><i class="'+kind+'" style="width:'+percent+'%"></i></span><span class="bar-label">'+percent+'%</span>'}
function systemVerdict(overview){const gap=overview.recommend.gap,h5=overview.headroom['5h'],h7=overview.headroom['7d'],target=overview.target_headroom;
  const coverage=overview.coverage['7d'],cooling=overview.supply.health.cooling,total=overview.subs,critical=value=>value!=null&&value<1,tight=value=>value!=null&&value<target;
  if(critical(h5)||critical(h7)||(total>0&&cooling>=total))return{kind:'bad',title:'Дефицит ёмкости — нужно +'+Math.max(1,gap)+' подписок',
    detail:'headroom 5h '+ratio(h5)+' / 7d '+ratio(h7)+' · потребление близко к потолку'};
  if(gap>0||tight(h5)||tight(h7)||coverage>1||cooling>0){const why=gap>0?'рекомендуется +'+gap+' подписок':tight(h5)||tight(h7)?'запас ниже цели ×'+target:
    coverage>1?'балансы клиентов ×'+coverage+' к ёмкости':cooling+' подписок остывают';return{kind:'warn',title:'Под контролем, но нужно внимание',detail:why+' · headroom 5h '+ratio(h5)+' / 7d '+ratio(h7)}}
  return{kind:'ok',title:'Запаса ёмкости хватает',detail:'headroom 5h '+ratio(h5)+' / 7d '+ratio(h7)+' · подписок '+total+', цель ×'+target+' выдержана'}}
async function system(){const result=await Promise.all([api('/overview'),api('/capacity').catch(()=>null),api('/subs').catch(()=>null)]),overview=result[0],capacity=result[1],subs=result[2];
  const supply=overview.supply,health=supply.health,demand=overview.demand,recommend=overview.recommend,verdict=systemVerdict(overview),mult=overview.ref_mult;
  // Мёртвые токены теперь DURABLE: движок пишет auth_state ('healthy'|'suspect'|'dead') прямо в БД по
  // коррелированным probe, и /subs (жизненный цикл) отдаёт его по-строчно — больше НЕ угадываем по
  // 4-символьному префиксу из /capacity. `capOpen` сохраняет раскрытие секции через 3с-перерисовку.
  const deadCount=(subs?.dead)??(capacity?.dead)??0;
  const suspectCount=(capacity?.suspect)||0;
  const deadLabel=r=>r==='permission_error'?'токен мёртв · бан':r==='authentication_error'?'токен мёртв · нужен re-auth':'токен мёртв';
  const capOpen=document.getElementById('cap-details')?.open?' open':'';
  const horizonCards=[['7d','7 дней','7d'],['1d','1 день',null],['5h','5 часов (burst)','5h']].map(item=>{const available=supply.avail_usd[item[0]]||0,head=item[2]?overview.headroom[item[2]]:null;
    return card('доступно · '+item[1],money(available),'клиентам ×'+mult+' = '+money(available*mult)+(item[2]?' · запас '+ratio(head):''))}).join('');
  const liveRows=(capacity?.per_sub||[]).map(item=>'<tr><td class="left"><span class="dot '+(item.dead||item.cooling?'bad':item.auth_state==='suspect'||String(item.status).includes('warn')?'warn':'')+'"></span> '+esc(item.email)+
    (item.dead?' '+pill(deadLabel(item.dead_reason),'bad'):item.auth_state==='suspect'?' '+pill('под наблюдением (auth)','warn'):'')+(item.calibrated?'':' <span class="muted">(калибровка)</span>')+'</td><td>'+capacityBar(item.util5h)+'</td><td>'+duration(item.reset5h_in)+'</td><td>'+capacityBar(item.util7d)+
    '</td><td>'+duration(item.reset7d_in)+'</td><td><b>'+money(item.rem5h_usd)+'</b></td><td><b>'+money(item.rem7d_usd)+'</b></td><td><b>'+money(item.avail_7d_usd)+'</b></td></tr>').join('');
  const lifecycleRows=(subs?.subs||[]).map(item=>{const days=Number(item.sub_days_left||0),dayKind=days<=0?'bad':days<7?'warn':'ok',dead=item.auth_state==='dead',suspect=item.auth_state==='suspect';return '<tr><td class="left"><b>'+esc(item.email)+
    '</b></td><td>'+(dead?pill(deadLabel(item.dead_reason),'bad'):suspect?pill('под наблюдением (auth)','warn'):pill(item.status,item.status==='active'?'ok':'warn'))+'</td><td>'+esc(String(item.added||'').slice(0,10)||'—')+'</td><td><span class="dot '+dayKind+'"></span>'+(days>0?days+' дн.':'—')+
    '</td><td><b>'+(Number(item.peak_cap5h_usd)>0?money(item.peak_cap5h_usd):'—')+'</b></td><td><b>'+(Number(item.peak_cap7d_usd)>0?money(item.peak_cap7d_usd):'—')+
    '</b></td><td class="left">'+esc(item.proxy_host||'—')+'</td><td>'+esc(String(item.proxy_expire||'').slice(0,10)||'—')+'</td></tr>'}).join('');
  const accountRows=(overview.accounts||[]).map(account=>'<tr><td class="left muted">'+esc(account.account)+'</td><td class="left"><b>'+esc(account.handle||'—')+'</b></td><td>'+
    pill(account.status,account.status==='active'?'ok':'bad')+'</td><td><b>'+money(account.balance_usd)+'</b></td><td><b>'+money(account.spent_usd)+'</b></td><td>×'+esc(account.mult)+'</td></tr>').join('');
  const body=(deadCount?'<div class="banner bad"><span class="dot"></span><div><b>'+deadCount+' подписок с МЁРТВЫМ токеном</b><span class="muted">вне ротации — нужен свежий OAuth-токен (setup-token) на этот аккаунт'+(suspectCount?' · '+suspectCount+' под наблюдением':'')+'</span></div></div>':suspectCount?'<div class="banner warn"><span class="dot"></span><div><b>'+suspectCount+' подписок под наблюдением (auth падает)</b><span class="muted">движок корроборирует чистыми probe; при подтверждении — пометит DEAD</span></div></div>':'')+
    '<div class="banner '+verdict.kind+'"><span class="dot"></span><div><b>'+esc(verdict.title)+'</b><span class="muted">'+esc(verdict.detail)+'</span></div></div>'+
    '<h2>Предложение — real-API USD</h2><div class="cards">'+horizonCards+card('балансы клиентов',money(demand.balance_usd),'резерв '+money(demand.reserved_usd)+' · coverage 7d ×'+overview.coverage['7d'])+
    '</div><h2>Флот и спрос</h2><div class="cards">'+card('подписки',overview.subs,health.healthy+' живых · '+health.cooling+' cooling')+
    card('утилизация средняя',Math.round(supply.util['7d']*100)+'%','7d · '+Math.round(supply.util['5h']*100)+'% за 5h')+
    '<div class="card" data-spend-stats title="Разбивка: сутки / 7 дней / 30 дней"><div class="label">всего потрачено · разбивка</div><div class="value">'+money(demand.spent_usd)+'</div><div class="hint">потенциальный спрос '+money(demand.potential_realapi_usd)+' real-API</div></div>'+
    card('рекомендация',recommend.gap>0?'+'+recommend.gap:'ok','нужно '+recommend.subs_needed+' подписок · есть '+overview.subs)+'</div>'+
    '<h2>Жизненный цикл подписок'+(subs?' · замена через '+subs.lifetime_days+'д от добавления':'')+'</h2><div class="table"><div class="scroll"><table><thead><tr><th class="left">подписка</th><th>статус</th><th>добавлена</th><th>живёт ещё</th><th>пик 5h</th><th>пик 7d</th><th class="left">прокси</th><th>прокси до</th></tr></thead><tbody>'+
    (lifecycleRows||empty(8))+'</tbody></table></div></div><h2>Аккаунты движка · '+(overview.accounts||[]).length+'</h2><div class="table"><div class="scroll"><table><thead><tr><th class="left">account</th><th class="left">handle</th><th>статус</th><th>баланс</th><th><span data-spend-stats title="Разбивка: сутки / 7 дней / 30 дней">потрачено</span></th><th>множитель</th></tr></thead><tbody>'+
    (accountRows||empty(6))+'</tbody></table></div></div><details id="cap-details"'+capOpen+'><summary>Ёмкость по подпискам · '+overview.subs+(deadCount?' · '+deadCount+' мёртвых':'')+' (live util/cooling/reset)</summary><div class="table"><div class="scroll"><table><thead><tr><th class="left">подписка</th><th>5h</th><th>сброс</th><th>7d</th><th>сброс</th><th>остаток 5h</th><th>остаток 7d</th><th>доступно 7d</th></tr></thead><tbody>'+
    (liveRows||empty(8))+'</tbody></table></div></div></details><footer>Обновление каждые 3с · «доступно» учитывает сбросы окон · «запас» = доступно ÷ текущее потребление · клиентам ×'+mult+'</footer>';
  page('система',body,pill(overview.subs+' подписок',verdict.kind))}

async function audit(){const rows=(await api('/admin/audit?limit=200')).rows||[],bodyRows=rows.map(item=>'<tr><td>'+date(item.created_at,true)+'</td><td class="left">'+
  pill(item.action,item.action.startsWith('admin.')?'warn':'')+'</td><td class="left">'+esc(item.actor_type)+'<div class="sub">'+esc(item.actor_id||'system')+'</div></td><td class="left">'+
  esc(item.target_type)+' · '+esc(item.target_id)+'</td><td class="left"><div class="json" title="'+esc(JSON.stringify(item.metadata||{}))+'">'+esc(JSON.stringify(item.metadata||{}))+'</div></td></tr>').join('');
  page('аудит','<h2>Журнал действий</h2><div class="table"><div class="scroll"><table><thead><tr><th>время</th><th class="left">действие</th><th class="left">актор</th>'+
  '<th class="left">цель</th><th class="left">метаданные</th></tr></thead><tbody>'+(bodyRows||empty(5))+'</tbody></table></div></div><footer>Последние 200 событий. Секреты и полные API-ключи не записываются.</footer>',pill(rows.length+' событий','ok'))}
refresh();
</script>
</body>
</html>
