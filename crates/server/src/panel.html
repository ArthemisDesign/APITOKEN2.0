<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-api · ёмкость пула</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#262d36;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#4dabf7; --ok:#40c057; --warn:#fab005; --bad:#fa5252;
    --track:#232a33;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f8; --panel:#fff; --panel2:#f0f3f6; --line:#e2e8ee; --fg:#1a2028;
           --dim:#5b6774; --track:#e6ebf0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  .badge{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line)}
  .badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  main{padding:22px;max-width:1200px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card .h{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .card .v{font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .card .s{color:var(--dim);font-size:12px;margin-top:4px}
  .card .bind{font-size:11px;margin-top:8px;padding:2px 8px;border-radius:6px;display:inline-block;
              background:var(--panel2);color:var(--dim)}
  .card .bind.w7{color:var(--warn)} .card .bind.w5{color:var(--accent)}
  h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.l,th.l{text-align:left}
  .bar{position:relative;height:8px;border-radius:5px;background:var(--track);overflow:hidden;min-width:90px}
  .bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
  .bar>i.hi{background:var(--warn)} .bar>i.max{background:var(--bad)}
  .pct{color:var(--dim);font-size:11px;margin-left:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .muted{color:var(--dim)}
  .setup{max-width:420px;margin:60px auto;background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:24px}
  .setup input{width:100%;padding:10px 12px;margin-top:12px;border-radius:9px;border:1px solid var(--line);
               background:var(--bg);color:var(--fg);font:inherit}
  .setup button{margin-top:12px;width:100%;padding:10px;border-radius:9px;border:0;background:var(--accent);
                color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .err{color:var(--bad);font-size:12px;margin-top:10px}
  footer{color:var(--dim);font-size:11px;text-align:center;padding:18px}
  .flash{animation:f .6s ease}@keyframes f{from{background:color-mix(in srgb,var(--accent) 18%,transparent)}to{}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=(x)=>'$'+(x??0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDur=(s)=>{s=Math.max(0,s|0);const d=s/86400|0,h=(s%86400)/3600|0,m=(s%3600)/60|0;
  return d?`${d}д ${h}ч`:h?`${h}ч ${m}м`:`${m}м`};
const key=()=>localStorage.getItem('capkey')||'';
let timer=null, prev={};

function setup(msg){
  clearInterval(timer);
  document.getElementById('app').innerHTML='';
  const box=$(`<div class="setup"><h1 style="margin:0 0 4px">Панель ёмкости пула</h1>
    <div class="muted" style="font-size:12px">Введи ключ панели (CLAUDE_API_PANEL_KEY) — read-only, хранится только в этом браузере. НЕ используй admin/control-ключ.</div>
    <input id="k" type="password" placeholder="pnl-..." value="${esc(key())}">
    <button id="go">Открыть</button>${msg?`<div class="err">${msg}</div>`:''}</div>`);
  document.getElementById('app').appendChild(box);
  box.querySelector('#go').onclick=()=>{localStorage.setItem('capkey',box.querySelector('#k').value.trim());start()};
  box.querySelector('#k').onkeydown=(e)=>{if(e.key==='Enter')box.querySelector('#go').click()};
}

async function tick(){
  let r;
  try{ r=await fetch('/capacity',{headers:{'x-api-key':key()}}); }
  catch(e){ return render(null,'сеть недоступна'); }
  if(r.status===401){ return setup('ключ отклонён'); }
  if(!r.ok){ return render(null,'ошибка '+r.status); }
  render(await r.json());
}

function bindLabel(c){ // какое окно связывает горизонт: сравниваем 5h- и 7d-ветки
  return null;
}

function render(d,err){
  const app=document.getElementById('app');
  if(!d){ if(!document.getElementById('cards')) setup(err); return; }
  const A=d.available_usd, calib=d.calibrated;
  const horizons=[['next_1h','1 час'],['next_5h','5 часов'],['next_1d','1 день'],['next_7d','7 дней']];
  const cardsHtml=horizons.map(([k,l])=>{
    const v=A[k]||0, sell=v*0.20;
    return `<div class="card"><div class="h">доступно · ${l}</div>
      <div class="v" data-k="${k}">${fmtUsd(v)}</div>
      <div class="s">клиентам ×0.20 = ${fmtUsd(sell)}</div></div>`;
  }).join('');

  const rows=(d.per_sub||[]).map(c=>{
    const st=c.cooling?'bad':(String(c.status).includes('warning')?'warn':'ok');
    const b=(u)=>{const p=Math.min(100,Math.round(u*100));const cl=p>=95?'max':p>=70?'hi':'';
      return `<div class="bar"><i class="${cl}" style="width:${p}%"></i></div><span class="pct">${p}%</span>`};
    return `<tr>
      <td class="l"><span class="dot ${st}"></span>${esc(c.email)}${c.calibrated?'':' <span class="muted">(калибр…)</span>'}</td>
      <td><div style="display:flex;align-items:center;justify-content:flex-end">${b(c.util5h)}</div></td>
      <td class="muted">${fmtDur(c.reset5h_in)}</td>
      <td><div style="display:flex;align-items:center;justify-content:flex-end">${b(c.util7d)}</div></td>
      <td class="muted">${fmtDur(c.reset7d_in)}</td>
      <td>${fmtUsd(c.rem5h_usd)}</td>
      <td>${fmtUsd(c.rem7d_usd)}</td>
      <td>${fmtUsd(c.avail_1d_usd)}</td>
      <td>${fmtUsd(c.avail_7d_usd)}</td>
    </tr>`;
  }).join('');

  app.innerHTML=`
    <header>
      <h1>claude-api</h1><span class="sub">ёмкость пула · USD real-API-эквивалента</span>
      <span class="badge ${calib?'ok':'warn'}">${calib?'калибровано':'калибруется…'}</span>
    </header>
    <main>
      <div class="cards" id="cards">${cardsHtml}</div>
      <h2>Подписки · ${d.subs}</h2>
      <div style="overflow-x:auto"><table>
        <thead><tr>
          <th class="l">подписка</th><th>5h util</th><th>сброс</th><th>7d util</th><th>сброс</th>
          <th>ост. 5h</th><th>ост. 7d</th><th>1 день</th><th>7 дней</th>
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="9" class="muted l">нет подписок</td></tr>'}</tbody>
      </table></div>
      <footer>обновление каждые 2с · «доступно» = максимум real-API-USD на горизонте (учёт сбросов окон) ·
        клиентам продаём ×0.20</footer>
    </main>`;

  // мигание карточек при изменении
  horizons.forEach(([k])=>{const el=app.querySelector(`.v[data-k="${k}"]`);
    if(el&&prev[k]!==undefined&&prev[k]!==A[k]){el.parentElement.classList.add('flash');
      setTimeout(()=>el.parentElement.classList.remove('flash'),600)}
    prev[k]=A[k];});
}

function start(){
  clearInterval(timer);
  if(!key()) return setup();
  tick(); timer=setInterval(tick,2000);
}
start();
</script>
</body>
</html>
