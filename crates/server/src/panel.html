<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apiToken.sale · панель</title>
<style>
/* ── Дизайн-ДНК apitoken.sale (apps/web globals.css): mono, свет по умолчанию, один синий акцент,
   сетка-атмосфера, joined-полосы статов, uppercase-лейблы. Держать в синхроне с токенами сайта. ── */
:root{
  --bg:#ffffff; --bg-soft:#f5f5f4; --bg-card:#ffffff;
  --line:rgba(10,10,10,0.12); --line-strong:rgba(10,10,10,0.20);
  --txt:#0a0a0a; --txt-2:#63625c; --txt-3:#696862; --txt-4:#73726c;
  --accent:#3767f0; --accent-soft:rgba(55,103,240,0.08); --accent-line:rgba(55,103,240,0.30);
  --ok:#1a9e57; --ok-soft:rgba(26,158,87,.08); --ok-line:rgba(26,158,87,.30);
  --warn:#b8760a; --warn-soft:rgba(184,118,10,.08); --warn-line:rgba(184,118,10,.30);
  --danger:#b42318; --danger-soft:rgba(180,35,24,.07); --danger-line:rgba(180,35,24,.30);
  --grid:rgba(10,10,10,0.035);
  --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 30px rgba(10,10,10,.06);
  --radius:4px;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0a0a0a; --bg-soft:#111111; --bg-card:#0e0e0e;
  --line:rgba(255,255,255,0.10); --line-strong:rgba(255,255,255,0.18);
  --txt:#ffffff; --txt-2:rgba(255,255,255,0.88); --txt-3:rgba(255,255,255,0.74); --txt-4:rgba(255,255,255,0.64);
  --accent:#4778ff; --accent-soft:rgba(71,120,255,0.10); --accent-line:rgba(71,120,255,0.35);
  --ok:#43d17a; --ok-soft:rgba(67,209,122,.10); --ok-line:rgba(67,209,122,.35);
  --warn:#ffb020; --warn-soft:rgba(255,176,32,.10); --warn-line:rgba(255,176,32,.35);
  --danger:#ff7b72; --danger-soft:rgba(255,123,114,.10); --danger-line:rgba(255,123,114,.35);
  --grid:rgba(255,255,255,0.02);
  --shadow:0 0 0 1px rgba(255,255,255,.03);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt-2);
  font-family:var(--font-mono);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px}
::selection{background:var(--accent);color:#fff}

/* ── шапка: бренд + вкладки + статус + тема (как header.nav сайта) ── */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:22px;
  height:60px;padding:0 24px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.brand{font-weight:700;font-size:16px;color:var(--txt);letter-spacing:.02em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.brand small{font-weight:400;font-size:11px;color:var(--txt-4);margin-left:10px;letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;align-self:stretch}
nav.tabs button{font:inherit;font-size:13px;color:var(--txt-3);background:none;border:0;cursor:pointer;
  padding:0 14px;border-bottom:2px solid transparent;transition:.15s}
nav.tabs button:hover{color:var(--txt)}
nav.tabs button.on{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;
  border-radius:99px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok-line)}
.badge.warn{color:var(--warn);border-color:var(--warn-line)}
.badge.bad{color:var(--danger);border-color:var(--danger-line)}
.theme-tgl{background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius);
  color:var(--txt-3);width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s;font-size:15px;line-height:1}
.theme-tgl:hover{border-color:var(--accent);color:var(--accent)}

main{padding:26px 24px 10px;max-width:1200px;margin:0 auto}
h2{font-size:11px;font-weight:600;color:var(--txt-4);text-transform:uppercase;letter-spacing:.12em;margin:30px 0 12px}
h2:first-child{margin-top:0}

/* ── вердикт: статусная полоса (как .pricing-banner сайта) ── */
.verdict{display:flex;align-items:center;gap:16px;border:1px solid var(--accent-line);
  background:var(--accent-soft);border-radius:10px;padding:16px 20px;margin-bottom:22px}
.verdict .dot-big{flex:none;width:12px;height:12px;border-radius:50%}
.verdict .t{font-size:15px;font-weight:700;color:var(--txt)}
.verdict .d{color:var(--txt-3);font-size:12.5px;margin-top:2px}
.verdict.ok{border-color:var(--ok-line);background:var(--ok-soft)}
.verdict.ok .dot-big{background:var(--ok);box-shadow:0 0 0 5px var(--ok-soft)}
.verdict.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.verdict.warn .dot-big{background:var(--warn);box-shadow:0 0 0 5px var(--warn-soft)}
.verdict.bad{border-color:var(--danger-line);background:var(--danger-soft)}
.verdict.bad .dot-big{background:var(--danger);box-shadow:0 0 0 5px var(--danger-soft)}

/* ── stats-полоса: joined-ячейки как .stats сайта (не отдельные карточки) ── */
.cards{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:6px;
  overflow:hidden;background:var(--bg-card);box-shadow:var(--shadow);margin-bottom:18px}
[data-theme="dark"] .cards{box-shadow:none}
@media(max-width:860px){.cards{grid-template-columns:repeat(2,1fr)}
  .card:nth-child(2n){border-right:0}.card:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.card{padding:20px 22px;border-right:1px solid var(--line)}
.card:last-child{border-right:0}
.card .h{font-size:11px;color:var(--txt-4);text-transform:uppercase;letter-spacing:.08em}
.card .v{font-size:30px;font-weight:700;color:var(--txt);margin-top:8px;line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card .v .unit{font-size:14px;font-weight:400;color:var(--txt-4);letter-spacing:0}
.card .s{color:var(--txt-3);font-size:12px;margin-top:7px}
.card .hr{font-size:11px;margin-top:9px;padding:3px 9px;border-radius:99px;display:inline-block;
  border:1px solid var(--line);color:var(--txt-3)}
.hr.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.hr.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.hr.bad{color:var(--danger);border-color:var(--danger-line);background:var(--danger-soft)}

/* ── таблицы: как .tier-table сайта (bg-soft шапка, hover accent-soft, tabular) ── */
.tbl{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg-card);
  box-shadow:var(--shadow);margin-bottom:18px}
[data-theme="dark"] .tbl{box-shadow:none}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-4);font-weight:500;
  background:var(--bg-soft)}
td{font-size:13px;color:var(--txt-2)}
td.l,th.l{text-align:left}
td.num{color:var(--txt);font-weight:600}
tbody tr{transition:background-color .15s ease}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.sub-line{font-size:11px;color:var(--txt-4);font-weight:400;margin-top:3px}

/* ── бар утилизации: тонкий, скруглённый, статус по порогу ── */
.bar{position:relative;height:6px;border-radius:4px;background:var(--bg-soft);
  box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;min-width:84px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar>i.hi{background:var(--warn)} .bar>i.max{background:var(--danger)}
.pct{color:var(--txt-4);font-size:11px;margin-left:7px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--danger)}
.muted{color:var(--txt-4)}
.pill{font-size:10.5px;letter-spacing:.02em;padding:2px 7px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--bg-soft);color:var(--txt-3);margin-right:4px}
.pill.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.pill.bad{color:var(--danger);border-color:var(--danger-line);background:var(--danger-soft)}
.act{font:inherit;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:var(--radius);padding:4px 10px;cursor:pointer;
  transition:.15s;white-space:nowrap}
.act:hover{background:var(--accent);color:#fff}
.act[disabled]{opacity:.4;cursor:not-allowed}

/* ── вход (фолбэк без Caddy): как .auth-card сайта ── */
.setup{max-width:420px;margin:80px auto;background:var(--bg-card);border:1px solid var(--line);
  border-radius:10px;padding:36px 32px;box-shadow:var(--shadow)}
.setup h1{font-size:22px;font-weight:700;color:var(--txt);margin:0 0 8px}
.setup .sub{color:var(--txt-3);font-size:13px;margin-bottom:22px}
.setup input{width:100%;background:var(--bg-soft);border:1px solid var(--line-strong);border-radius:var(--radius);
  color:var(--txt);font-family:var(--font-mono);font-size:14px;padding:12px 14px;transition:.15s}
.setup input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.setup button{margin-top:14px;width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--accent);
  background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:.16s}
.setup button:hover{box-shadow:0 0 0 4px var(--accent-soft)}
.setup button:active{transform:translateY(1px)}
.err{color:var(--danger);font-size:12px;margin-top:12px}

details{margin-top:8px} summary{cursor:pointer;color:var(--txt-3);font-size:13px;padding:4px 0}
summary:hover{color:var(--txt)}
footer{color:var(--txt-4);font-size:11.5px;text-align:center;padding:26px 24px 30px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=(x)=>'$'+(+x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dur=(s)=>{s=Math.max(0,s|0);const d=s/86400|0,h=(s%86400)/3600|0,m=(s%3600)/60|0;
  return d?`${d}д ${h}ч`:h?`${h}ч ${m}м`:`${m}м`};
const xr=(v)=>v==null?'∞':('×'+(+v).toLocaleString('en-US',{maximumFractionDigits:v<10?1:0}));
// AUDIT-TODO(C32): enforce server-side that panel routes accept only panel-scoped credentials, never control/admin keys.
let panelKey='';
const key=()=>panelKey;
let timer=null;
// Вкладка живёт в URL (#users) — refresh и шеринг ссылки не сбрасывают её на «Обзор».
let tab=location.hash==='#users'?'users':'overview';
addEventListener('hashchange',()=>{const t=location.hash==='#users'?'users':'overview';
  if(t!==tab){tab=t;start()}});
const ago=(iso)=>{if(!iso)return '—';const s=(Date.now()-new Date(iso).getTime())/1e3|0;
  if(s<60)return 'только что';if(s<3600)return `${s/60|0}м назад`;if(s<86400)return `${s/3600|0}ч назад`;
  return `${s/86400|0}д назад`};
const dt=(iso)=>iso?new Date(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';

/* тема: как на сайте — data-theme на корне, выбор хранится в браузере */
function initTheme(){
  const saved=localStorage.getItem('panel-theme');
  const dark=saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
}
function toggleTheme(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;localStorage.setItem('panel-theme',next);
}
initTheme();

const headerHtml=(sub,badge)=>`<header>
  <span class="brand">api<i>Token</i>.sale<small>${esc(sub)}</small></span>
  <nav class="tabs">
    <button class="${tab==='overview'?'on':''}" data-tab="overview">Обзор</button>
    <button class="${tab==='users'?'on':''}" data-tab="users">Пользователи</button>
  </nav>
  <span class="hd-right">${badge||''}
    <button class="theme-tgl" onclick="toggleTheme()" title="тема">◐</button></span>
</header>`;
function bindTabs(){document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  if(tab!==b.dataset.tab){tab=b.dataset.tab;
    history.replaceState(null,'',tab==='users'?'#users':location.pathname);start()}})}
/* Перерисовка тика не должна дёргать читателя: сохраняем скролл и раскрытые <details>. */
function repaint(html){
  const y=scrollY;
  const open=[...document.querySelectorAll('details[open] summary')].map(s=>s.textContent.trim());
  document.getElementById('app').innerHTML=html;
  document.querySelectorAll('details').forEach(d=>{
    const s=d.querySelector('summary');
    if(s&&open.includes(s.textContent.trim())) d.open=true;});
  scrollTo(0,y);
  bindTabs();
  bindCredit();
}

/* Начисление баланса: целые USD строкой цифр (правило проекта — без float/точек/ведущих нулей). */
function bindCredit(){
  document.querySelectorAll('[data-credit]').forEach(b=>b.onclick=async()=>{
    const amount=prompt(`Начислить баланс ${b.dataset.email}\n\nСумма в USD (целое число, 1–99999):`);
    if(amount==null) return;
    const v=amount.trim();
    if(!/^[1-9][0-9]{0,4}$/.test(v)) return alert('Нужно целое число долларов от 1 до 99999, без точек и ведущих нулей.');
    if(!confirm(`Начислить $${v} пользователю ${b.dataset.email}?`)) return;
    b.disabled=true;
    try{
      const k=key();
      const r=await fetch(`/admin/users/${b.dataset.credit}/credit`,{method:'POST',
        headers:{'content-type':'application/json',...(k?{'x-api-key':k}:{})},
        body:JSON.stringify({amount_usd:v})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.message||('ошибка '+r.status));
      alert(`Начислено $${v}. Новый баланс: $${j.balance??'?'}`);
      tick();
    }catch(e){ alert('Не удалось начислить: '+e.message); b.disabled=false; }
  });
}

function setup(msg){
  clearInterval(timer);
  document.getElementById('app').innerHTML='';
  const box=$(`<div class="setup"><h1>Центр управления</h1>
    <div class="sub">Введи только отдельный read-only ключ панели (за Caddy обычно не требуется). Никогда не вводи здесь control/admin-ключ: ключ хранится только в памяти этой вкладки и исчезнет при перезагрузке.</div>
    <input id="k" type="password" placeholder="ключ панели…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="go">Открыть</button>${msg?`<div class="err">${msg}</div>`:''}</div>`);
  document.getElementById('app').appendChild(box);
  box.querySelector('#go').onclick=()=>{panelKey=box.querySelector('#k').value.trim();box.querySelector('#k').value='';start()};
  box.querySelector('#k').onkeydown=(e)=>{if(e.key==='Enter')box.querySelector('#go').click()};
}

async function getj(path){
  const k=key();
  const h=k?{'x-api-key':k}:{};              // за Caddy ключ инжектится server-side
  const r=await fetch(path,{headers:h});
  if(r.status===401) throw {auth:true};
  if(!r.ok) throw {msg:'ошибка '+r.status};
  return r.json();
}

async function tick(){
  if(tab==='users') return tickUsers();
  let ov,cap,subs;
  try{ [ov,cap,subs]=await Promise.all([getj('/overview'),getj('/capacity').catch(()=>null),getj('/subs').catch(()=>null)]); }
  catch(e){ if(e.auth){panelKey='';return setup('нужен read-only ключ панели')} return; }
  render(ov,cap,subs);
}

async function tickUsers(){
  let data;
  try{ data=await getj('/admin/users'); }
  catch(e){
    // 401 тут НЕ значит «нужен ключ панели»: /admin/users живёт в commerce-backend и доступен
    // только через Caddy panel-домена (server-side инжект x-admin-key). Показываем ошибку на месте.
    const why=e.auth?'нет доступа: маршрут /admin/users доступен только через panel-домен (Caddy инжектит x-admin-key; проверь, что ключ совпадает с COMMERCIAL_ADMIN_KEY бэкенда)':(e.msg||'ошибка сети');
    repaint(`${headerHtml('пользователи')}
      <main><div class="verdict bad"><span class="dot-big"></span><div><div class="t">Не удалось загрузить пользователей</div>
      <div class="d">${esc(why)}</div></div></div></main>`);
    return; }
  renderUsers(data.users||[]);
}

function renderUsers(users){
  const n=(x)=>+x||0;
  const totBal=users.reduce((a,u)=>a+n(u.balance_usd),0);
  const totSpent=users.reduce((a,u)=>a+n(u.spent_usd),0);
  const totPaid=users.reduce((a,u)=>a+n(u.payments?.paid_total_usd),0);
  const paidCnt=users.reduce((a,u)=>a+n(u.payments?.paid_count),0);
  const payers=users.filter(u=>n(u.payments?.paid_count)>0).length;
  const active7=users.filter(u=>u.last_seen_at&&Date.now()-new Date(u.last_seen_at).getTime()<7*86400e3).length;
  const tierName=(t)=>['Starter','Builder','Pro','Studio','Scale'][t]??t;
  const rows=users.map(u=>{
    const p=u.payments||{}, k=u.api_keys||{};
    const auth=(u.auth_methods||[]).map(m=>`<span class="pill">${esc(m)}</span>`).join('')||'<span class="muted">—</span>';
    const flags=`${u.email_verified?'<span class="pill ok">почта ✓</span>':'<span class="pill warn">почта ✗</span>'}${u.totp_enabled?'<span class="pill ok">2FA</span>':''}`;
    const st=u.status==='active'?(u.engine_live_status==='disabled'?'warn':'ok'):'bad';
    const tier=u.customer_type==='b2b'?'B2B':(u.tier!=null?tierName(u.tier):'—');
    const disc=u.multiplier_bp!=null?`−${100-u.multiplier_bp/100}%`:'—';
    return `<tr>
      <td class="l"><span class="dot ${st}"></span><b style="color:var(--txt);font-weight:600">${esc(u.email)}</b>
        <div class="sub-line">${esc(u.display_name||'')} · ${auth}${flags}</div></td>
      <td class="l">${esc(tier)}<div class="sub-line">${esc(disc)}</div></td>
      <td class="num">${u.balance_usd!=null?usd(u.balance_usd):'<span class="muted">—</span>'}</td>
      <td class="num">${u.spent_usd!=null?usd(u.spent_usd):'<span class="muted">—</span>'}<div class="sub-line">30д: ${usd(u.spent_30d_usd)}</div></td>
      <td>${n(p.paid_count)>0?`<span class="num">${usd(p.paid_total_usd)}</span><div class="sub-line">${p.paid_count} шт · ${dt(p.last_paid_at)}</div>`:'<span class="muted">не пополнял</span>'}</td>
      <td>${n(k.active)}${n(k.total)>n(k.active)?`<span class="muted">/${k.total}</span>`:''}</td>
      <td class="muted">${ago(u.last_seen_at)}</td>
      <td class="muted">${dt(u.created_at)}</td>
      <td>${u.engine_account_id?`<button class="act" data-credit="${esc(u.id)}" data-email="${esc(u.email)}">+ баланс</button>`:'<span class="muted" title="аккаунт движка ещё не создан">—</span>'}</td>
    </tr>`;
  }).join('');
  repaint(`
    ${headerHtml('пользователи',`<span class="badge ok">${users.length} юзеров</span>`)}
    <main>
      <h2>Сводка</h2>
      <div class="cards">
        <div class="card"><div class="h">пользователей</div><div class="v">${users.length}</div>
          <div class="s">${active7} активны за 7 дней</div></div>
        <div class="card"><div class="h">пополнено всего</div><div class="v">${usd(totPaid)}</div>
          <div class="s">${paidCnt} платежей · ${payers} платящих</div></div>
        <div class="card"><div class="h">на балансах</div><div class="v">${usd(totBal)}</div>
          <div class="s">live из движка</div></div>
        <div class="card"><div class="h">потрачено юзерами</div><div class="v">${usd(totSpent)}</div>
          <div class="s">по прайсу клиента (с наценкой)</div></div>
      </div>
      <h2>Все пользователи</h2>
      <div class="tbl"><div class="tbl-scroll"><table>
        <thead><tr><th class="l">пользователь</th><th class="l">тир</th><th>баланс</th><th>потрачено</th>
          <th>пополнения</th><th>ключи</th><th>был(а)</th><th>регистрация</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="9" class="muted l">нет пользователей</td></tr>'}</tbody>
      </table></div></div>
      <footer>обновление каждые 15с · баланс/расход — live из движка · пополнения — подтверждённые платежи</footer>
    </main>`);
}

function verdict(ov){
  const g=ov.recommend.gap, h5=ov.headroom['5h'], h7=ov.headroom['7d'], th=ov.target_headroom;
  const cov=ov.coverage['7d'], cooling=ov.supply.health.cooling, subs=ov.subs;
  const crit=(x)=>x!=null&&x<1;                 // реальный дефицит: ёмкость кончается СЕЙЧАС
  const tight=(x)=>x!=null&&x<th;               // тесно относительно цели запаса
  if(crit(h5)||crit(h7)||(subs>0&&cooling>=subs)){
    return {c:'bad',t:`Дефицит ёмкости — нужно +${Math.max(1,g)} подписок`,
      d:`headroom 5h ${xr(h5)} / 7d ${xr(h7)} · потребление близко к потолку`};
  }
  if(g>0||tight(h5)||tight(h7)||cov>1||cooling>0){
    const why = g>0 ? `рекомендую +${g} подписок`
      : (tight(h5)||tight(h7)) ? `запас ниже цели ×${th}`
      : cov>1 ? `балансы юзеров ×${cov} к ёмкости (перепродано «на бумаге» — риск только если начнут тратить)`
      : `${cooling} подписок остывают`;
    return {c:'warn',t:'Под контролем, но следим', d:`${esc(why)} · headroom 5h ${xr(h5)} / 7d ${xr(h7)}`};
  }
  return {c:'ok',t:'Здорово — запаса хватает',
    d:`headroom 5h ${xr(h5)} / 7d ${xr(h7)} · подписок ${subs}, цель ×${th} держим`};
}

function render(ov,cap,subs){
  const S=ov.supply, D=ov.demand, m=ov.ref_mult, v=verdict(ov);
  const hclass=(x)=>x==null?'ok':(x<1?'bad':x<ov.target_headroom?'warn':'ok');

  const win=[['7d','7 дней','7d'],['1d','1 день',null],['5h','5 часов (бёрст)','5h']];
  const supplyCards=win.map(([k,l,hk])=>{
    const a=S.avail_usd[k]||0, h=hk?ov.headroom[hk]:null;
    return `<div class="card"><div class="h">доступно · ${l}</div>
      <div class="v">${usd(a)}</div>
      <div class="s">клиентам ×${m} = ${usd(a*m)}</div>
      ${hk?`<div class="hr ${hclass(h)}">запас ${xr(h)}</div>`:''}</div>`;
  }).join('');

  const demandCard=`<div class="card"><div class="h">баланс юзеров</div>
      <div class="v">${usd(D.balance_usd)}</div>
      <div class="s">резерв ${usd(D.reserved_usd)} · ключей ${D.active_keys}</div>
      <div class="hr ${ov.coverage['7d']>1?'bad':'ok'}">coverage 7d ×${ov.coverage['7d']}</div></div>`;

  const health=S.health, util=S.util;
  const rec=ov.recommend;

  const subRows=(cap?.per_sub||[]).map(c=>{
    const st=c.cooling?'bad':(String(c.status).includes('warn')?'warn':'ok');
    const bar=(u)=>{const p=Math.min(100,Math.round(u*100));const cl=p>=95?'max':p>=70?'hi':'';
      return `<div style="display:flex;align-items:center;justify-content:flex-end"><div class="bar"><i class="${cl}" style="width:${p}%"></i></div><span class="pct">${p}%</span></div>`};
    return `<tr>
      <td class="l"><span class="dot ${st}"></span>${esc(c.email)}${c.calibrated?'':' <span class="muted">(калибр…)</span>'}</td>
      <td>${bar(c.util5h)}</td><td class="muted">${dur(c.reset5h_in)}</td>
      <td>${bar(c.util7d)}</td><td class="muted">${dur(c.reset7d_in)}</td>
      <td class="num">${usd(c.rem5h_usd)}</td><td class="num">${usd(c.rem7d_usd)}</td><td class="num">${usd(c.avail_7d_usd)}</td>
    </tr>`;
  }).join('');

  repaint(`
    ${headerHtml('центр управления',`<span class="badge ${v.c}">${ov.calibrated?'калибровано':'калибруется…'}</span>`)}
    <main>
      <div class="verdict ${v.c}"><span class="dot-big"></span>
        <div><div class="t">${esc(v.t)}</div><div class="d">${esc(v.d)}</div></div></div>

      <h2>Предложение — доступно real-API (USD)</h2>
      <div class="cards">${supplyCards}${demandCard}</div>

      <h2>Флот и спрос</h2>
      <div class="cards">
        <div class="card"><div class="h">подписки</div><div class="v">${ov.subs}</div>
          <div class="s"><span class="dot ok"></span>${health.healthy} живых · <span class="dot bad"></span>${health.cooling} остывают</div></div>
        <div class="card"><div class="h">утилизация (сред.)</div><div class="v">${Math.round(util['7d']*100)}<span class="unit">% 7d</span></div>
          <div class="s">${Math.round(util['5h']*100)}% за 5h</div></div>
        <div class="card"><div class="h">всего потрачено</div><div class="v">${usd(D.spent_usd)}</div>
          <div class="s">потенц. спрос ${usd(D.potential_realapi_usd)} real-API</div></div>
        <div class="card"><div class="h">рекомендация</div>
          <div class="v" style="color:${rec.gap>0?'var(--warn)':'var(--ok)'}">${rec.gap>0?'+'+rec.gap:'ок'}</div>
          <div class="s">нужно ${rec.subs_needed} подписок (есть ${ov.subs})</div></div>
      </div>

      <h2>Жизненный цикл подписок ${subs?`· замена: ${subs.lifetime_days}д от добавления`:''}</h2>
      <div class="tbl"><div class="tbl-scroll"><table>
        <thead><tr><th class="l">подписка</th><th>статус</th><th>добавлена</th><th>живёт ещё</th>
          <th>пик 5h</th><th>пик 7d</th><th class="l">прокси</th><th>прокси до</th></tr></thead>
        <tbody>${(subs?.subs||[]).map(s=>{
          const dl=s.sub_days_left, dc=dl<=0?'bad':dl<7?'warn':'ok';
          const pe=(s.proxy_expire||'').slice(0,10);
          const pk5=s.peak_cap5h_usd||0, pk7=s.peak_cap7d_usd||0;
          return `<tr>
            <td class="l" style="color:var(--txt);font-weight:600">${esc(s.email)}</td>
            <td class="muted">${esc(s.status)}</td>
            <td class="muted">${esc((s.added||'').slice(0,10)||'—')}</td>
            <td><span class="dot ${dc}"></span>${dl>0?dl+' дн':'—'}</td>
            <td class="num">${pk5>0?usd(pk5):'<span class="muted">—</span>'}</td>
            <td class="num">${pk7>0?usd(pk7):'<span class="muted">—</span>'}</td>
            <td class="l muted">${esc(s.proxy_host||'—')}</td>
            <td class="muted">${pe||'—'}</td>
          </tr>`}).join('')||'<tr><td colspan="8" class="muted l">нет подписок</td></tr>'}</tbody>
      </table></div></div>

      <details>
        <summary>Ёмкость по подпискам · ${ov.subs} (live util/cooling)</summary>
        <div class="tbl" style="margin-top:10px"><div class="tbl-scroll"><table>
          <thead><tr><th class="l">подписка</th><th>5h</th><th>сброс</th><th>7d</th><th>сброс</th>
            <th>ост. 5h</th><th>ост. 7d</th><th>доступно 7d</th></tr></thead>
          <tbody>${subRows||'<tr><td colspan="8" class="muted l">нет данных по подпискам</td></tr>'}</tbody>
        </table></div></div>
      </details>

      <footer>обновление каждые 3с · «доступно» = максимум real-API-USD на горизонте (учёт сбросов окон) ·
        «запас» = доступно ÷ текущее потребление · клиентам ×${m}</footer>
    </main>`);
}

function start(){
  clearInterval(timer);
  tick(); timer=setInterval(tick,tab==='users'?15000:3000);
}
start();
</script>
</body>
</html>
