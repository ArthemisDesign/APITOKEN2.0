[package]
name = "suno-credential"
version = "0.1.0"
edition = "2021"
description = "Encrypted, identity-bound Suno (suno.com) session-cookie credential envelopes"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = { version = "1", features = ["derive"] }
