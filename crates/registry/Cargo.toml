[package]
name = "registry"
version = "0.1.0"
edition = "2021"
description = "Engine-owned PostgreSQL registry with a SQLite migration source"

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
