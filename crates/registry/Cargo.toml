[package]
name = "registry"
version = "0.1.0"
edition = "2021"
description = "Engine-owned PostgreSQL registry with a SQLite migration source"

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
elog = { path = "../elog" }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
