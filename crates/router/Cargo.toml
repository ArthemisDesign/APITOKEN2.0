[package]
name = "claude-router"
version = "0.1.0"
edition = "2021"
description = "Unified stateless entry point: native-lane fan-in and aggregated model catalog over the provider planes (docs/engine/UNIFIED_ROUTER.md)"

[[bin]]
name = "claude-router"
path = "src/main.rs"

[dependencies]
anyhow = "1"
elog = { path = "../elog" }
axum = "0.8"
futures-util = "0.3"
getrandom = "0.3"
# Loopback-only client: no TLS, no transparent content decoding. Decoding would strip
# Content-Encoding while forwarding bytes and break byte-exact native lanes.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# Test-only: the advertised-model manifest lives here, the exact tariff authority lives in
# `metering`, and `advertised_models_all_have_an_exact_tariff` is what ties the two together.
metering = { path = "../metering" }
tokio = { version = "1", features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
