# Persistent, bounded system journal.
#
# Without this drop-in journald runs with `Storage=auto`, which decides volatile-vs-persistent once
# at start by testing whether /var/log/journal exists. That directory is created as a side effect of
# the Alloy bind mount in observability/compose.yaml, so the decision depends on whether the
# monitoring stack happened to start before journald — the journal silently ended up in /run
# (tmpfs), capped near RuntimeMaxUse and discarded on every reboot. Decide it explicitly here
# instead of inheriting whatever the boot order produced.
#
# The size bound is equally deliberate: the SystemMaxUse default is 10% of the filesystem, which on
# the production RAID array is roughly 88G. Pin an explicit budget so log volume can never grow into
# a disk-capacity problem.
[Journal]
Storage=persistent
SystemMaxUse=8G
SystemMaxFileSize=512M
MaxRetentionSec=90day
