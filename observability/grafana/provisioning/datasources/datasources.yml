apiVersion: 1

deleteDatasources:
  - { name: Prometheus, orgId: 1 }
  - { name: Loki, orgId: 1 }

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3101
    editable: false
    jsonData:
      maxLines: 2000
