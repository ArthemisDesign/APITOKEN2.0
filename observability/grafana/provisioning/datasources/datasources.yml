apiVersion: 1

deleteDatasources:
  - { name: Prometheus, orgId: 1 }
  - { name: Loki, orgId: 1 }
  - { name: Engine Request Analytics, orgId: 1 }

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3101
    editable: false
    jsonData:
      maxLines: 2000

  # Private, read-only aggregate views. This datasource never grants Grafana access to the base
  # request_facts, usage_events, account, key, or ledger tables.
  - name: Engine Request Analytics
    uid: engine-request-analytics
    type: postgres
    access: proxy
    url: 127.0.0.1:5433
    user: apitoken_monitoring
    editable: false
    secureJsonData:
      password: ${MONITORING_POSTGRES_PASSWORD}
    jsonData:
      # Grafana 12+ ignores top-level `database` and the panel UI then shows
      # "No data" / "no default database configured".
      database: claude_engine
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
