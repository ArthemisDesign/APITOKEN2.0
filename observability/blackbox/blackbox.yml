modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false

  http_auth_gate:
    prober: http
    timeout: 8s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [401]

  http_support:
    prober: http
    timeout: 8s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: [200, 406]

  http_openai_surface:
    prober: http
    timeout: 8s
    http:
      method: POST
      preferred_ip_protocol: ip4
      follow_redirects: false
      # A legacy loopback-trusted bridge rejects the missing model with 400; fixed enabled mode
      # authenticates first with 401; disabled mode returns 404. None can execute a provider turn.
      valid_status_codes: [400, 401, 404]
      headers:
        Content-Type: application/json
      body: '{}'
      fail_if_body_not_matches_regexp:
        - '"type"[[:space:]]*:[[:space:]]*"invalid_request_error"'
        - '"(code"[[:space:]]*:[[:space:]]*"(invalid_api_key|model_not_found)"|param"[[:space:]]*:[[:space:]]*"model")'
