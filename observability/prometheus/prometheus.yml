global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    site: apitoken-sale

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]

  - job_name: redis
    static_configs:
      - targets: ["127.0.0.1:9121"]
        labels: { component: affinity-redis, instance_role: history }
      - targets: ["127.0.0.1:9122"]
        labels: { component: affinity-redis, instance_role: affinity }

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:2019"]

  - job_name: claude-engine
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/engine_metrics_token
    static_configs:
      - targets: ["127.0.0.1:8790"]
        labels: { provider: anthropic }
      - targets: ["127.0.0.1:8792"]
        labels: { provider: openai }
      - targets: ["127.0.0.1:8794"]
        labels: { provider: gemini }
      - targets: ["127.0.0.1:8803"]
        labels: { provider: kimi }

  - job_name: staging-veth
    metrics_path: /metrics
    static_configs:
      - targets: ["10.254.32.2:3901"]
        labels: { env: staging, component: safe-sinks }
    sample_limit: 2000
    label_limit: 32
    label_name_length_limit: 64
    label_value_length_limit: 256

  - job_name: claude-router
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8802"]

  # The devbot notification bot exposes its own /metrics on the same loopback port as its
  # webhook (127.0.0.1:3800). Telegram send failures and the last accepted webhook delivery
  # drive DevBotTelegramSendFailures / DevBotWebhookSilent; the job is excluded from
  # MonitoringTargetDown (a deliberately unprovisioned bot has no listener on 3800), and
  # DevBotMetricsDown covers the active-but-unscrapable case instead.
  - job_name: devbot
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:3800"]
        labels: { component: devbot }

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3600"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3101"]

  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["127.0.0.1:9115"]

  - job_name: public-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://api.apitoken.sale/health"]
        labels: { component: claude-engine, provider: anthropic }
      - targets: ["https://router.apitoken.sale/health"]
        labels: { component: claude-engine, provider: unified }
      - targets: ["https://backend.apitoken.sale/v1/ready"]
        labels: { component: commerce-api }
      - targets: ["https://apitoken.sale/status"]
        labels: { component: public-web }
      - targets: ["https://partners.apitoken.sale/v1/ready"]
        labels: { component: sales-api }
      - targets: ["https://partners.apitoken.sale/"]
        labels: { component: sales-web }
      - targets: ["https://mail.apitoken.sale/"]
        labels: { component: mail }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: openai-http
    metrics_path: /probe
    params:
      module: [http_openai_surface]
    static_configs:
      - targets: ["https://openai.api.apitoken.sale/v1/responses"]
        labels: { component: codex-provider, provider: openai }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: gemini-http
    metrics_path: /probe
    params:
      module: [http_gemini_surface]
    static_configs:
      - targets: ["https://gemini.api.apitoken.sale/v1beta/models/gemini-provider-probe:generateContent"]
        labels: { component: gemini-provider, provider: gemini }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: protected-http
    metrics_path: /probe
    params:
      module: [http_auth_gate]
    static_configs:
      - targets: ["https://admin.apitoken.sale/"]
        labels: { component: main-admin }
      - targets: ["https://admin.partners.apitoken.sale/"]
        labels: { component: sales-admin }
      - targets: ["https://crm.apitoken.sale/"]
        labels: { component: crm }
      - targets: ["https://content-studio.apitoken.sale/"]
        labels: { component: content-studio }
      - targets: ["https://monitoring.apitoken.sale/"]
        labels: { component: monitoring }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: support-http
    metrics_path: /probe
    params:
      module: [http_support]
    static_configs:
      - targets: ["https://support.apitoken.sale/"]
        labels: { component: support }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: openkeys-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://openkeys.apitoken.sale/api/ready"]
        labels: { component: openkeys }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: loopback-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://127.0.0.1:3410/api/ready"]
        labels: { component: openkeys }
      - targets: ["http://127.0.0.1:3300/"]
        labels: { component: crm-web }
      - targets: ["http://127.0.0.1:3500/"]
        labels: { component: content-studio-local }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
