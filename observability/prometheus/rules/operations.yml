groups:
  - name: monitoring-self-health
    rules:
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          component: '{{ $labels.job }}'
        annotations:
          summary: 'Prometheus cannot scrape {{ $labels.job }}'
          description: 'The target {{ $labels.instance }} has failed every scrape for more than two minutes.'
          runbook: 'MONITORING.md#monitoringtargetdown'

      - alert: PublicEndpointDown
        expr: probe_success{job=~"public-http|openai-http|protected-http|support-http|loopback-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.component }} synthetic check is failing'
          description: 'The HTTP/TLS probe for {{ $labels.instance }} has failed for more than two minutes.'
          runbook: 'MONITORING.md#publicendpointdown'

      # During the one-release provider bridge, 8787/8788 deliberately have a second, opposite
      # health verdict under the OpenAI fallback. MonitoringTargetDown covers stable Anthropic;
      # keep this Caddy-native alert on the unambiguous commerce pair until bridge cleanup.
      - alert: ProxyUpstreamPairDown
        expr: sum(caddy_reverse_proxy_upstreams_healthy{upstream=~"127\\.0\\.0\\.1:(3000|3001)"}) == 0
        for: 2m
        labels:
          severity: critical
          component: ingress
        annotations:
          summary: 'Every commerce API slot is unhealthy'
          description: 'No commerce API slot (3000/3001) has passed its Caddy health check for more than two minutes.'
          runbook: 'MONITORING.md#proxyupstreampairdown'

      - alert: CertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"public-http|openai-http|protected-http|support-http"} - time()) < 14 * 24 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate for {{ $labels.component }} expires soon'
          description: 'The earliest certificate in the chain expires in less than 14 days.'
          runbook: 'MONITORING.md#certificateexpiressoon'

      - alert: BusinessCollectorStale
        expr: time() - apitoken_monitoring_collector_last_success_unixtime > 180
        for: 2m
        labels:
          severity: critical
          component: business-metrics
        annotations:
          summary: 'Durable business-state metrics are stale'
          description: 'The systemd collector has not completed successfully for more than three minutes.'
          runbook: 'MONITORING.md#businesscollectorstale'

      - alert: BusinessCollectorMissing
        expr: absent(apitoken_monitoring_collector_last_success_unixtime)
        for: 3m
        labels:
          severity: critical
          component: business-metrics
        annotations:
          summary: 'Durable business-state metrics are missing'
          description: 'Node Exporter has not received any output from the business-state collector.'
          runbook: 'MONITORING.md#businesscollectorstale'

      - alert: SystemdCollectorFailed
        expr: node_scrape_collector_success{collector="systemd"} == 0
        for: 2m
        labels:
          severity: critical
          component: node-exporter
        annotations:
          summary: 'Node Exporter cannot read systemd state'
          description: 'Service and timer failure detection is unavailable.'
          runbook: 'MONITORING.md#monitoringtargetdown'

      - alert: JournalDeliveryFailing
        expr: increase(loki_write_request_duration_seconds_count{status_code!~"2.."}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: log-pipeline
        annotations:
          summary: 'Alloy cannot deliver journals to Loki'
          description: 'The local log pipeline has received non-success responses during the last five minutes.'
          runbook: 'MONITORING.md#monitoringtargetdown'

  - name: host-health
    rules:
      - alert: HostDiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: 'Production root disk has less than 15% free space'
          description: 'Only {{ $value | humanizePercentage }} of the root filesystem is free.'
          runbook: 'MONITORING.md#hostdiskspacelow'

      - alert: HostDiskSpaceCritical
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.08
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: 'Production root disk has less than 8% free space'
          description: 'Only {{ $value | humanizePercentage }} of the root filesystem is free.'
          runbook: 'MONITORING.md#hostdiskspacelow'

      - alert: HostInodesLow
        expr: node_filesystem_files_free{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_files{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.10
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: 'Production root filesystem is low on inodes'
          description: 'Less than 10% of root filesystem inodes remain.'
          runbook: 'MONITORING.md#hostdiskspacelow'

      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: 'Production host has less than 10% available memory'
          description: 'Available memory has remained below 10% for ten minutes.'
          runbook: 'MONITORING.md#hostmemorypressure'

      - alert: HostCpuSaturated
        expr: 1 - avg without(cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels:
          severity: warning
          component: host
        annotations:
          summary: 'Production CPU usage is above 90%'
          description: 'Average CPU saturation has remained above 90% for fifteen minutes.'
          runbook: 'MONITORING.md#hostcpusaturated'

      - alert: HostClockSkew
        expr: abs(node_time_seconds - time()) > 30
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: 'Production host clock differs from Prometheus by over 30 seconds'
          description: 'Clock skew can invalidate leases, authentication, and payment timestamps.'
          runbook: 'MONITORING.md#hostclockskew'

      - alert: ProjectSystemdUnitFailed
        expr: node_systemd_unit_state{name=~"(apitoken-(api@.+|worker|content-studio|sales-api|sales-web|crm-api|crm-web|openkeys|deploy-watchdog|monitoring-collector|affinity-redis)|claude-api(@.+|-openai))\\.service",state="failed"} == 1
        for: 1m
        labels:
          severity: critical
          component: systemd
        annotations:
          summary: 'Project service {{ $labels.name }} is failed'
          description: 'systemd reports the production unit in failed state.'
          runbook: 'MONITORING.md#projectsystemdunitfailed'

      - alert: CriticalTimerFailed
        expr: node_systemd_unit_state{name=~"(claude-api-backup|apitoken-deploy-watchdog|apitoken-monitoring-collector)\\.timer",state="active"} == 0
        for: 5m
        labels:
          severity: critical
          component: systemd-timer
        annotations:
          summary: 'Critical timer {{ $labels.name }} is not active'
          description: 'Backups, deployment reconciliation, or business metrics may no longer run.'
          runbook: 'MONITORING.md#criticaltimerfailed'

      - alert: ServiceRestartLoop
        expr: changes(node_systemd_unit_state{name=~"(apitoken-(api@.+|worker|content-studio|sales-api|sales-web|crm-api|crm-web|openkeys)|claude-api(@.+|-openai))\\.service",state="active"}[15m]) > 4
        for: 5m
        labels:
          severity: warning
          component: systemd
        annotations:
          summary: 'Service {{ $labels.name }} is repeatedly changing state'
          description: 'The service active state changed more than four times in fifteen minutes.'
          runbook: 'MONITORING.md#servicerestartloop'

  - name: postgres-health
    rules:
      - alert: PostgresUnavailable
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: 'PostgreSQL exporter cannot connect'
          description: 'The shared production PostgreSQL instance is unavailable to its monitoring role.'
          runbook: 'MONITORING.md#postgresunavailable'

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.80
        for: 10m
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: 'PostgreSQL connection use exceeds 80%'
          description: 'The database is approaching its configured connection limit.'
          runbook: 'MONITORING.md#postgresconnectionshigh'

      - alert: PostgresDeadlocksDetected
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        labels:
          severity: warning
          component: postgres
        annotations:
          summary: 'PostgreSQL recorded new deadlocks'
          description: '{{ $value }} deadlocks were recorded during the last fifteen minutes.'
          runbook: 'MONITORING.md#postgresdeadlocksdetected'
