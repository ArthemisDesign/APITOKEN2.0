groups:
  - name: caddy-ingress
    rules:
      - alert: CaddyUpstreamFiveXxRateHigh
        expr: |
          (
            sum by (host) (rate(caddy_http_request_duration_seconds_count{handler="reverse_proxy",code=~"5.."}[5m]))
            /
            sum by (host) (rate(caddy_http_request_duration_seconds_count{handler="reverse_proxy"}[5m]))
          ) > 0.05
          and
          sum by (host) (rate(caddy_http_request_duration_seconds_count{handler="reverse_proxy"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: caddy
        annotations:
          summary: '{{ $labels.host }} is returning more than 5% upstream 5xx responses'
          description: 'The per-host reverse-proxy 5xx ratio has remained elevated for ten minutes.'
          runbook: 'docs/ops/MONITORING.md#publicendpointdown'

  - name: claude-engine
    rules:
      - alert: EngineCircuitBreakerOpen
        expr: claude_api_breaker_open{provider="anthropic"} == 1
        for: 1m
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Claude engine circuit breaker is open'
          description: 'The engine is rejecting traffic because upstream failures crossed the safety threshold.'
          runbook: 'docs/ops/MONITORING.md#enginecircuitbreakeropen'

      - alert: EngineHasNoSubscriptions
        expr: claude_api_subs{provider="anthropic"} < 1
        for: 2m
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Claude engine has no available subscriptions'
          description: 'No subscription is currently loaded into the production engine pool.'
          runbook: 'docs/ops/MONITORING.md#enginehasnosubscriptions'

      - alert: EngineAllSubscriptionsCooling
        expr: claude_api_subs{provider="anthropic"} > 0 and claude_api_cooling{provider="anthropic"} >= claude_api_subs{provider="anthropic"}
        for: 2m
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Every Claude subscription is cooling'
          description: 'The pool has no immediately usable subscription capacity.'
          runbook: 'docs/ops/MONITORING.md#engineallsubscriptionscooling'

      - alert: EngineUpstreamRateLimited
        expr: increase(claude_api_upstream_429_total{provider="anthropic"}[10m]) > 10
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude upstream rate limiting is elevated'
          description: 'More than ten upstream 429 responses were recorded in ten minutes.'
          runbook: 'docs/ops/MONITORING.md#engineupstreamratelimited'

      - alert: EngineUpstreamAuthFailures
        expr: increase(claude_api_upstream_auth_total{provider="anthropic"}[5m]) > 0
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Claude upstream rejected subscription authentication'
          description: 'At least one new upstream authentication failure was observed.'
          runbook: 'docs/ops/MONITORING.md#engineupstreamauthfailures'

      - alert: EngineUpstreamServerErrors
        expr: increase(claude_api_upstream_5xx_total{provider="anthropic"}[10m]) > 10
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude upstream 5xx responses are elevated'
          description: 'More than ten upstream server failures were recorded in ten minutes.'
          runbook: 'docs/ops/MONITORING.md#engineupstreamservererrors'

      - alert: ClaudeStoreFallbackFailing
        expr: increase(claude_api_claudestore_fallback_failures_total{provider=~"anthropic|openai"}[10m]) > 0
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'The emergency ClaudeStore transport failed'
          description: 'At least one last-resort attempt failed after the local provider pool had already become terminal.'
          runbook: 'docs/ops/MONITORING.md#claudestorefallbackfailing'

      - alert: EngineAffinityRedisErrors
        expr: sum by (provider) (increase(claude_api_affinity_redis_errors_total[10m])) > 5
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Cache-affinity Redis is degraded on the {{ $labels.provider }} plane'
          description: 'Shared affinity operations are failing; requests remain available on local fail-open affinity.'
          runbook: 'docs/ops/MONITORING.md#engineaffinityrediserrors'

      - alert: AnthropicCalibrationPersistenceFailed
        expr: claude_api_anthropic_calibration_persistence_ok{provider="anthropic"} == 0
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude exact calibration evidence is not durable'
          description: 'Turn evidence is pending, was quarantined/dropped, or the calibration authority cannot be read. Current API-dollar remaining is intentionally fail-closed.'
          runbook: 'docs/ops/MONITORING.md#anthropiccalibrationpersistencefailed'

      - alert: AnthropicQuotaSnapshotStale
        expr: claude_api_anthropic_quota_snapshot_subscriptions{provider="anthropic"} > 0 and time() - claude_api_anthropic_quota_last_observation_timestamp_seconds{provider="anthropic"} > 900
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude quota observations have stopped refreshing'
          description: 'The newest exact provider quota snapshot across the routable Anthropic fleet is older than the 900s freshness bound the panel and /capacity use. Every quota reading now reports a frozen value, and the panel degrades each window to a waiting state instead of showing real utilization. Suspect the free count-tokens probe path: a lost poller leader lease, a wedged persona proxy, or CLAUDE_API_POLL disabled.'
          runbook: 'docs/ops/MONITORING.md#anthropicquotasnapshotstale'

      - alert: ExecutionGroupDoubleWinner
        expr: increase(claude_api_execution_group_double_winner_total[5m]) > 0
        labels:
          severity: critical
          component: execution-fencing
        annotations:
          summary: 'A fallback execution group attempted a second nonzero settlement'
          description: 'The durable winner fence refunded a later provider execution. Investigate the started/not-started boundary before enabling more fallback traffic.'
          runbook: 'docs/ops/MONITORING.md#executiongroupdoublewinner'

  # Shared Redis holds two consumers with very different blast radii. Affinity stores short digests
  # and its loss only costs prompt-cache hits; Codex response history stores whole conversations up
  # to 16 MiB each, and its loss is reported to the client as a 400 that well-behaved clients treat
  # as permanent. Under allkeys-lru the eviction policy cannot tell the two apart, so memory
  # pressure silently deletes paid-for conversations. None of this was measured before.
  - name: affinity-redis
    rules:
      - alert: AffinityRedisDown
        expr: redis_up == 0 or sum(absent(redis_up{instance_role="history"}) or absent(redis_up{instance_role="affinity"})) > 0
        for: 5m
        labels:
          severity: warning
          component: affinity-redis
        annotations:
          summary: 'Shared Redis instance {{ $labels.instance_role }} is unreachable'
          description: 'Losing the affinity instance costs only cross-slot prompt-cache hits. Losing the history instance breaks Codex previous_response_id continuity across slots, which clients see as a permanent 400.'
          runbook: 'docs/ops/MONITORING.md#affinityredisdown'

      - alert: AffinityRedisEvictingKeys
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
          component: affinity-redis
        annotations:
          summary: 'Shared Redis instance {{ $labels.instance_role }} is evicting keys under memory pressure'
          description: 'On the affinity instance this costs prompt-cache hits only. On the history instance it deletes stored conversations and clients receive a permanent-looking 400, so treat that case as customer-visible.'
          runbook: 'docs/ops/MONITORING.md#affinityredisevictingkeys'

      - alert: AffinityRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_config_maxmemory > 0.85
        for: 15m
        labels:
          severity: warning
          component: affinity-redis
        annotations:
          summary: 'Shared Redis instance {{ $labels.instance_role }} is near its memory ceiling'
          description: 'Eviction begins at the ceiling. Each instance has its own budget, so raise that one rather than the pair; for the history instance, lowering CLAUDE_API_CODEX_HISTORY_TTL_SECS is the other lever.'
          runbook: 'docs/ops/MONITORING.md#affinityredismemoryhigh'

      - alert: CodexHistoryWriteFailures
        expr: increase(claude_api_codex_history_write_failures_total[15m]) > 5
        for: 10m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex response history is not reaching the shared store'
          description: 'Turns still succeed on local memory, so this is silent to the caller until a later request lands on another slot and cannot resolve previous_response_id.'
          runbook: 'docs/ops/MONITORING.md#codexhistorywritefailures'

      - alert: CodexHistoryMissesElevated
        expr: increase(claude_api_codex_history_misses_total[15m]) > 20
        for: 10m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex previous_response_id lookups are missing'
          description: 'Each miss becomes a 400 that clients treat as permanent, so they discard a conversation the customer already paid to build. Check Redis eviction and history TTL together.'
          runbook: 'docs/ops/MONITORING.md#codexhistorymisseselevated'

      - alert: BillingPGCommandLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(claude_api_billing_pg_command_duration_seconds_bucket[5m])) by (le, op)) > 0.5
        for: 10m
        labels:
          severity: warning
          component: billing
        annotations:
          summary: 'PostgreSQL money commands are slow on the billing hot path'
          description: 'p99 of {{ $labels.op }} measured across reconnect and retry exceeds 500 ms for 10 minutes. Every reserve, settlement and capacity lease pays this synchronously; the pool authorizes nothing while the writer waits.'
          runbook: 'docs/ops/MONITORING.md#billingpgcommandlatencyhigh'

      - alert: BillingWriteQueueBacklog
        expr: claude_api_billing_write_queue_depth > 2048
        for: 5m
        labels:
          severity: warning
          component: billing
        annotations:
          summary: 'Billing write queue is more than half full'
          description: 'Over half of the 4096-slot single-writer channel is occupied for 5 minutes. A full channel back-pressures every request; correlate with BillingPGCommandLatencyHigh to tell a slow database from a traffic burst.'
          runbook: 'docs/ops/MONITORING.md#billingwritequeuebacklog'

  # Serial continuation is off by default. These rules make the canary and eventual GA observable
  # without adding request, model, credential or execution-group identities to Prometheus labels.
  - name: router-fallback
    rules:
      - record: claude_router:fallback_rate5m
        expr: sum(rate(claude_router_fallback_total[5m]))

      - record: claude_api:execution_not_started_rate5m
        expr: sum by (plane) (rate(claude_api_execution_not_started_total[5m]))

      - alert: RouterMetricsDown
        expr: up{job="claude-router"} == 0 or absent(up{job="claude-router"})
        for: 2m
        labels:
          severity: critical
          component: claude-router
        annotations:
          summary: 'Prometheus cannot scrape the unified router'
          description: 'The loopback claude-router metrics target is down or missing, so fallback canary evidence is unavailable.'
          runbook: 'docs/ops/MONITORING.md#routermetricsdown'

      - alert: RouterFallbackRateHigh
        expr: claude_router:fallback_rate5m > 1
        for: 10m
        labels:
          severity: warning
          component: claude-router
        annotations:
          summary: 'The unified router is starting more than one fallback per second'
          description: 'Serial continuation has remained above one new fallback attempt per second for ten minutes.'
          runbook: 'docs/ops/MONITORING.md#routerfallbackratehigh'

      - alert: RouterConnectionRefusedFallback
        expr: increase(claude_router_fallback_total{reason="connect_refused"}[5m]) > 0
        labels:
          severity: warning
          component: claude-router
        annotations:
          summary: 'A provider origin refused a router connection'
          description: 'At least one serial continuation was started after a stable provider origin returned TCP ConnectionRefused.'
          runbook: 'docs/ops/MONITORING.md#routerconnectionrefusedfallback'

      - alert: RouterAdmissionFailures
        expr: increase(claude_router_body_admission_overload_total[5m]) + increase(claude_router_body_read_timeout_total[5m]) > 0
        labels:
          severity: warning
          component: claude-router
        annotations:
          summary: 'The unified router rejected a request at body admission'
          description: 'At least one universal request exhausted the bounded body budget or exceeded the idle/maximum body-read deadline.'
          runbook: 'docs/ops/MONITORING.md#routeradmissionfailures'

      - alert: RouterAuthorityFailures
        expr: |
          sum(increase(claude_router_auth_preflight_total{outcome="unavailable"}[10m]))
          + sum(increase(claude_router_catalog_refresh_total{outcome=~"failed|oversized"}[10m]))
          + sum(increase(claude_router_pricing_failure_total{reason="unavailable"}[10m]))
          + sum(increase(claude_router_policy_failure_total{reason="unavailable"}[10m])) > 10
        for: 5m
        labels:
          severity: warning
          component: claude-router
        annotations:
          summary: 'Router metadata authorities are repeatedly unavailable'
          description: 'Authentication, catalog, pricing, or routing-policy authority failures exceeded the bounded threshold.'
          runbook: 'docs/ops/MONITORING.md#routerauthorityfailures'

      - alert: RouterResponseHeaderTimeout
        expr: increase(claude_router_response_header_timeout_total[5m]) > 0
        labels:
          severity: warning
          component: claude-router
        annotations:
          summary: 'A read-only balance authority exceeded its response-header deadline'
          description: 'At least one bounded /balance authority attempt timed out before headers; the router safely continued to the next read-only authority.'
          runbook: 'docs/ops/MONITORING.md#routerresponseheadertimeout'

  # The OpenAI-compatible Codex provider is optional and fail-closed. Every rule below is gated on
  # claude_api_codex_enabled so a deployment with the provider switched off stays silent.
  - name: codex-provider
    rules:
      - alert: CodexProviderDown
        expr: claude_api_codex_enabled{provider="openai"} == 1 and claude_api_codex_process_live{provider="openai"} == 0
        for: 5m
        labels:
          severity: critical
          component: codex-provider
        annotations:
          summary: 'Codex provider has no working sealed profile'
          description: 'The OpenAI-compatible surface cannot serve any request: no configured home has a live child.'
          runbook: 'docs/ops/MONITORING.md#codexproviderdown'

      - alert: CodexNoAvailableHomes
        expr: claude_api_codex_enabled{provider="openai"} == 1 and claude_api_codex_homes_available{provider="openai"} < 1
        for: 5m
        labels:
          severity: critical
          component: codex-provider
        annotations:
          summary: 'Every Codex home is cooling or rate limited'
          description: 'The Codex pool has no home that can accept a request; clients are receiving retryable 429/503 responses.'
          runbook: 'docs/ops/MONITORING.md#codexnoavailablehomes'

      - alert: CodexHomeUnauthenticated
        expr: claude_api_codex_home_authenticated{provider="openai"} == 0
        for: 15m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} is not authenticated'
          description: 'Its ChatGPT device login no longer passes account/read. Pool capacity is degraded until an operator re-runs the device flow.'
          runbook: 'docs/ops/MONITORING.md#codexhomeunauthenticated'

      - alert: CodexHomeNearRateLimit
        expr: claude_api_codex_home_rate_limit_used_percent{provider="openai"} > 90
        for: 10m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} is close to its subscription window limit'
          description: 'This is a capacity-planning warning only. Traffic continues until a reported window reaches 100 percent or the provider reports its real limit, provided the home stays responsive.'
          runbook: 'docs/ops/MONITORING.md#codexhomenearratelimit'

      - alert: CodexHomeRateLimited
        expr: claude_api_codex_home_limit_reached{provider="openai"} == 1
        for: 15m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} left rotation on a full subscription window'
          description: 'The subscription window is reported full, so the gateway routes around this home until the window resets. Confirm the remaining homes absorb the load.'
          runbook: 'docs/ops/MONITORING.md#codexhomeratelimited'

      - alert: ConversationsForcedOffTheirHome
        expr: rate(claude_api_route_rebind_total[15m]) > 0 and rate(claude_api_route_rebind_total[15m]) / clamp_min(rate(claude_api_route_place_total[15m]), 0.001) > 0.3
        for: 15m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: 'Conversations are being moved off their subscription'
          description: 'More than a third of placements are migrations of existing conversations rather than new ones. Each migration throws away a warm prompt prefix the customer already paid to build and pays to build it again elsewhere, so this shows up as higher latency and higher cost before it shows up as an error. Usually it means subscriptions are hitting their windows or cooling for long enough to cross the rebind threshold; check pool capacity first.'
          runbook: 'docs/ops/MONITORING.md#conversationsforcedofftheirhome'

      - alert: CodexHomeUnresponsive
        expr: claude_api_codex_home_transport_wedged{provider="openai"} == 1 or claude_api_codex_home_transport_degraded{provider="openai"} == 1
        for: 3m
        labels:
          severity: critical
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} has stopped answering'
          description: 'Its app-server generation is missing RPC deadlines, so the gateway no longer admits new turns to it. In-flight turns are left to finish. A wedged transport is recycled automatically; if this persists, the daemon for this home is not recovering and needs an operator.'
          runbook: 'docs/ops/MONITORING.md#codexhomeunresponsive'

      - alert: CodexHomeSnapshotStale
        expr: claude_api_codex_home_snapshot_age_seconds{provider="openai"} > 600
        for: 5m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} quota evidence has stopped refreshing'
          description: 'The rate-limit snapshot is no longer being updated, so every quota gauge for this home reports a frozen value. The numbers can look perfectly healthy while the refresh path is broken — this alert is the only signal that distinguishes the two.'
          runbook: 'docs/ops/MONITORING.md#codexhomesnapshotstale'

      - alert: CodexAccountDead
        expr: claude_api_codex_home_account_dead{provider="openai"} == 1
        for: 5m
        labels:
          severity: critical
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} subscription is corroborated dead'
          description: 'Authentication failed on repeated clean probes spread over time, so this is a revoked, banned or expired subscription rather than a transient blip. Pool capacity is permanently reduced until an operator re-authenticates or replaces it.'
          runbook: 'docs/ops/MONITORING.md#codexaccountdead'

      - alert: CodexCalibrationPersistenceFailed
        expr: claude_api_codex_home_calibration_persistence_ok{provider="openai"} == 0
        for: 5m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} cannot persist calibration evidence'
          description: 'Traffic remains available, but cumulative spend or window evidence is pending and the capacity estimate may not survive restart.'
          runbook: 'docs/ops/MONITORING.md#codexcalibrationpersistencefailed'

  - name: gemini-provider
    rules:
      - alert: GeminiProviderDown
        expr: claude_api_gemini_enabled{provider="gemini"} == 1 and claude_api_gemini_profiles_authenticated{provider="gemini"} < 1
        for: 5m
        labels:
          severity: critical
          component: gemini-provider
        annotations:
          summary: 'Gemini provider has no authenticated paid project'
          description: 'Every configured Gemini credential failed health validation; the native API surface cannot serve generations.'
          runbook: 'docs/ops/MONITORING.md#geminiproviderdown'

      - alert: GeminiNoAvailableProfiles
        expr: claude_api_gemini_enabled{provider="gemini"} == 1 and claude_api_gemini_profiles_available{provider="gemini"} < 1
        for: 5m
        labels:
          severity: critical
          component: gemini-provider
        annotations:
          summary: 'Every Gemini project is cooling or exhausted'
          description: 'The Gemini pool has no project that can accept a request; clients receive a native retryable 429.'
          runbook: 'docs/ops/MONITORING.md#gemininoavailableprofiles'

      - alert: GeminiProfileUnauthenticated
        expr: claude_api_gemini_profile_authenticated{provider="gemini"} == 0
        for: 15m
        labels:
          severity: warning
          component: gemini-provider
        annotations:
          summary: 'Gemini profile {{ $labels.profile }} is unauthenticated'
          description: 'Google explicitly revoked this refresh credential with invalid_grant. Re-authorize the exact subject through Auth Bot; the sealed profile reloads without a Gemini restart.'
          runbook: 'docs/ops/MONITORING.md#geminiprofileunauthenticated'

      - alert: GeminiUpstreamRateLimited
        expr: increase(claude_api_upstream_429_total{provider="gemini"}[10m]) > 10
        for: 5m
        labels:
          severity: warning
          component: gemini-provider
        annotations:
          summary: 'Gemini project rate limiting is elevated'
          description: 'More than ten project-scoped RESOURCE_EXHAUSTED responses were observed in ten minutes.'
          runbook: 'docs/ops/MONITORING.md#geminiupstreamratelimited'

  # The backend-only KIMI (Kimi Code) plane is optional and fail-closed. Every rule below is
  # gated on claude_api_kimi_enabled so a deployment with the provider switched off stays silent.
  # KIMI series are scraped on the anthropic target and deliberately carry no provider label;
  # the kimi_ name prefix is the discriminator.
  - name: kimi-provider
    rules:
      - alert: KimiNoLiveProfiles
        expr: claude_api_kimi_enabled == 1 and claude_api_kimi_live_profiles == 0
        for: 10m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'KIMI provider has no live profile'
          description: 'The plane is enabled but no roster profile is authenticated; exact KIMI aliases fail closed while Claude keeps its existing path.'
          runbook: 'docs/ops/MONITORING.md#kiminoliveprofiles'

      - alert: KimiNoAvailableProfiles
        expr: claude_api_kimi_enabled == 1 and claude_api_kimi_live_profiles > 0 and claude_api_kimi_available_profiles == 0
        for: 15m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'Every KIMI profile is quarantined, cooling or quota-walled'
          description: 'Live profiles exist but none is eligible for selection; KIMI requests fail closed until a cooling axis clears.'
          runbook: 'docs/ops/MONITORING.md#kiminoavailableprofiles'

      - alert: KimiErrorShareHigh
        expr: |
          claude_api_kimi_enabled == 1
          and rate(claude_api_kimi_requests_total[15m]) > 0
          and (
            rate(claude_api_kimi_failures_total[15m])
            / rate(claude_api_kimi_requests_total[15m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'More than a fifth of KIMI requests are failing'
          description: 'Compare claude_api_kimi_capacity_exhausted_total against the failure rate: a capacity-dominated share means the fleet is quota-walled and needs another subscription, while failures without it point at the upstream or the transport.'
          runbook: 'docs/ops/MONITORING.md#kimierrorsharehigh'

      - alert: KimiUnreviewedPlanProfiles
        expr: claude_api_kimi_enabled == 1 and claude_api_kimi_unreviewed_plan_profiles > 0
        for: 30m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'A KIMI subscription is being served below its tier'
          description: 'A live profile reports a plan outside the documented ladder, so it serves kimi-for-coding at 256K only. k3, the 1M window and highspeed are refused before any request reaches the provider, and the caller sees a 429 that looks like an upstream rate limit. Add the tier to KIMI_REVIEWED_PLANS with dated evidence.'
          runbook: 'docs/ops/MONITORING.md#kimiunreviewedplanprofiles'

      - alert: KimiCalibrationPersistenceFailed
        expr: claude_api_kimi_enabled == 1 and claude_api_kimi_calibration_persistence_ok == 0
        for: 5m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'KIMI cannot persist calibration evidence'
          description: 'Turn events or quota observations are not reaching PostgreSQL; measured capacity may not survive restart.'
          runbook: 'docs/ops/MONITORING.md#kimicalibrationpersistencefailed'

      - alert: KimiCalibrationBacklog
        expr: claude_api_kimi_enabled == 1 and claude_api_kimi_calibration_pending_events > 0
        for: 10m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'KIMI calibration evidence is queued behind an undelivered head'
          description: 'The bounded turn FIFO holds pending events, and the provider quota read is suspended by design until the head drains.'
          runbook: 'docs/ops/MONITORING.md#kimicalibrationbacklog'

      - alert: KimiQuotaStale
        expr: claude_api_kimi_enabled == 1 and claude_api_kimi_live_profiles > 0 and time() - claude_api_kimi_quota_last_observation_timestamp_seconds > 900
        for: 15m
        labels:
          severity: warning
          component: kimi-provider
        annotations:
          summary: 'KIMI quota observations have stopped refreshing'
          description: 'The newest /usages observation is older than three default poll intervals (3 x 300s = 900s); every quota reading now reports a frozen value.'
          runbook: 'docs/ops/MONITORING.md#kimiquotastale'

  # The backend-only GLM (Z.ai Coding Plan) plane is optional and fail-closed. Every rule below
  # is gated on claude_api_glm_enabled so a deployment with the provider switched off stays
  # silent. GLM series are scraped on the anthropic target and deliberately carry no provider
  # label; the glm_ name prefix is the discriminator.
  - name: glm-provider
    rules:
      - alert: GlmNoLiveProfiles
        expr: claude_api_glm_enabled == 1 and claude_api_glm_live_profiles == 0
        for: 10m
        labels:
          severity: warning
          component: glm-provider
        annotations:
          summary: 'GLM provider has no live profile'
          description: 'The plane is enabled but no roster profile is authenticated; exact GLM aliases fail closed while Claude keeps its existing path.'
          runbook: 'docs/ops/MONITORING.md#glmnoliveprofiles'

      - alert: GlmNoAvailableProfiles
        expr: claude_api_glm_enabled == 1 and claude_api_glm_live_profiles > 0 and claude_api_glm_available_profiles == 0
        for: 15m
        labels:
          severity: warning
          component: glm-provider
        annotations:
          summary: 'Every GLM profile is dead, suspect, cooling or quota-walled'
          description: 'Live profiles exist but none is eligible for selection; GLM requests fail closed until an axis clears.'
          runbook: 'docs/ops/MONITORING.md#glmnoavailableprofiles'

      - alert: GlmCalibrationPersistenceFailed
        expr: claude_api_glm_enabled == 1 and claude_api_glm_calibration_persistence_ok == 0
        for: 5m
        labels:
          severity: warning
          component: glm-provider
        annotations:
          summary: 'GLM cannot persist calibration evidence'
          description: 'Turn events or quota observations are not reaching PostgreSQL; measured capacity may not survive restart.'
          runbook: 'docs/ops/MONITORING.md#glmcalibrationpersistencefailed'

      - alert: GlmCalibrationBacklog
        expr: claude_api_glm_enabled == 1 and claude_api_glm_calibration_pending_events > 0
        for: 10m
        labels:
          severity: warning
          component: glm-provider
        annotations:
          summary: 'GLM calibration evidence is queued behind an undelivered head'
          description: 'The bounded turn FIFO holds pending events, and the provider quota read is suspended by design until the head drains.'
          runbook: 'docs/ops/MONITORING.md#glmcalibrationbacklog'

      - alert: GlmQuotaStale
        expr: claude_api_glm_enabled == 1 and claude_api_glm_live_profiles > 0 and time() - claude_api_glm_quota_last_observation_timestamp_seconds > 900
        for: 15m
        labels:
          severity: warning
          component: glm-provider
        annotations:
          summary: 'GLM quota observations have stopped refreshing'
          description: 'The newest quota observation is older than three default poll intervals (3 x 300s = 900s); every quota reading now reports a frozen value.'
          runbook: 'docs/ops/MONITORING.md#glmquotastale'

      - alert: GlmAccountDead
        expr: claude_api_glm_enabled == 1 and claude_api_glm_account_dead_profiles > 0
        for: 10m
        labels:
          severity: warning
          component: glm-provider
        annotations:
          summary: 'A GLM subscription key is durably refused'
          description: 'The static key was refused or the plan expired; the profile stays out of rotation until the Auth Bot publishes a replacement — no timer clears this axis.'
          runbook: 'docs/ops/MONITORING.md#glmaccountdead'

  - name: durable-business-state
    rules:
      - alert: DurableQueueBacklog
        expr: apitoken_queue_ready > 25
        for: 10m
        labels:
          severity: warning
          component: '{{ $labels.queue }}'
        annotations:
          summary: '{{ $labels.queue }} has a sustained backlog'
          description: '{{ $value }} durable jobs are ready or retrying.'
          runbook: 'docs/ops/MONITORING.md#durablequeuebacklog'

      - alert: DurableQueueOldestItemStale
        expr: apitoken_queue_oldest_ready_seconds > 900
        for: 5m
        labels:
          severity: critical
          component: '{{ $labels.queue }}'
        annotations:
          summary: 'Oldest {{ $labels.queue }} job is over fifteen minutes old'
          description: 'A ready/retry job has not completed for {{ $value | humanizeDuration }}.'
          runbook: 'docs/ops/MONITORING.md#durablequeueoldestitemstale'

      - alert: DurableQueueDeadItems
        expr: apitoken_queue_dead > 0
        for: 1m
        labels:
          severity: critical
          component: '{{ $labels.queue }}'
        annotations:
          summary: '{{ $labels.queue }} contains terminally failed items'
          description: '{{ $value }} durable jobs require operator investigation.'
          runbook: 'docs/ops/MONITORING.md#durablequeuedeaditems'

      - alert: PricingPolicyDeliveryStale
        expr: apitoken_pricing_policy_oldest_pending_seconds > 120
        for: 5m
        labels:
          severity: critical
          component: pricing-worker
        annotations:
          summary: 'New account tariff policies are stuck before engine delivery'
          description: 'The oldest unconfirmed account policy binding is {{ $value | humanizeDuration }} old; affected customers see 503 on the dashboard until the pricing worker delivers. LISTEN/NOTIFY normally confirms within seconds.'
          runbook: 'docs/ops/MONITORING.md#pricingpolicydeliverystale'

      - alert: PricingPolicyDeliveryFailed
        expr: apitoken_pricing_policy_failed > 0
        for: 2m
        labels:
          severity: warning
          component: pricing-worker
        annotations:
          summary: 'Account policy engine activation failed terminally'
          description: '{{ $value }} account policy bindings sit in failed state; their owners stay without working API access until requeued after the cause is fixed.'
          runbook: 'docs/ops/MONITORING.md#pricingpolicydeliveryfailed'

      # Settled money, not a dry run. The shadow evaluation lane that used to answer this question
      # ran ahead of a rollout, wrote rows nothing read, and was silent during the cutover it
      # existed to protect. This reads what customers were actually charged, so it cannot be
      # skipped: a pricing change that charges the wrong amount fires it within the hour.
      - alert: PricingChargeMismatch
        expr: apitoken_pricing_charge_mismatch > 0
        for: 10m
        labels:
          severity: critical
          component: pricing
        annotations:
          summary: 'Charges do not match the multiplier they declare ({{ $labels.account_class }})'
          description: '{{ $value }} settled charges in the last hour billed an amount that disagrees with the payable multiplier recorded on the same row. Either the customer was overcharged or revenue was lost; both are money defects.'
          runbook: 'docs/ops/MONITORING.md#pricingchargemismatch'

      - alert: FailedWebhooksPresent
        expr: apitoken_webhook_failed > 0
        for: 2m
        labels:
          severity: critical
          component: payments
        annotations:
          summary: 'Payment webhooks are in failed state'
          description: '{{ $value }} verified webhook events have failed processing.'
          runbook: 'docs/ops/MONITORING.md#failedwebhookspresent'

      - alert: StaleCheckoutSessions
        expr: apitoken_checkout_stale > 0
        for: 15m
        labels:
          severity: warning
          component: payments
        annotations:
          summary: 'Checkout sessions have remained incomplete for over one hour'
          description: '{{ $value }} checkout sessions are stale.'
          runbook: 'docs/ops/MONITORING.md#stalecheckoutsessions'

      - alert: EngineSettlementBacklog
        expr: apitoken_engine_settlement_pending > 0
        for: 5m
        labels:
          severity: critical
          component: engine-settlement
        annotations:
          summary: 'Engine settlement outbox is not draining'
          description: '{{ $value }} request settlements are pending or processing.'
          runbook: 'docs/ops/MONITORING.md#enginesettlementbacklog'

      - alert: EngineExpiredLeasePresent
        expr: apitoken_engine_expired_active_leases > 0
        for: 2m
        labels:
          severity: critical
          component: engine-authority
        annotations:
          summary: 'Engine contains expired leases still marked active'
          description: '{{ $value }} capacity or reservation leases require reconciliation.'
          runbook: 'docs/ops/MONITORING.md#engineexpiredleasepresent'

      - alert: BalanceDivergenceDetected
        expr: apitoken_balance_divergence_nano > 0
        for: 2m
        labels:
          severity: critical
          component: engine-authority
        annotations:
          summary: 'Engine account balance conservation failed'
          description: 'At least one account differs from durable funding by {{ $value }} nanodollars after completed charges and active holds.'
          runbook: 'docs/ops/MONITORING.md#balancedivergencedetected'

      - alert: BackupStale
        expr: apitoken_backup_age_seconds > 5400
        for: 10m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: '{{ $labels.database }} backup is stale'
          description: 'The last validated dump is {{ $value | humanizeDuration }} old.'
          runbook: 'docs/ops/MONITORING.md#backupstale'

      - alert: BackupMissing
        expr: apitoken_backup_present == 0
        for: 2m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: '{{ $labels.database }} backup is missing'
          description: 'No current dump exists for this production database.'
          runbook: 'docs/ops/MONITORING.md#backupmissing'

      - alert: DeployQuarantined
        expr: apitoken_watchdog_quarantined == 1
        for: 2m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: 'A commit failed production delivery and is quarantined'
          description: 'The watchdog rejected the current master candidate; no later stage will run until a newer commit or an explicit retry.'
          runbook: 'docs/ops/MONITORING.md#deployquarantined'

      - alert: DeployPipelineStale
        expr: apitoken_watchdog_status_age_seconds > 900
        for: 5m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: 'The deploy watchdog has not reported for over 15 minutes'
          description: 'The poll loop runs every minute. A status file {{ $value | humanizeDuration }} old means delivery is no longer running.'
          runbook: 'docs/ops/MONITORING.md#deploypipelinestale'

      - alert: DeployStuckInPhase
        expr: apitoken_watchdog_phase{phase!~"idle|quarantined"} == 1
        for: 45m
        labels:
          severity: warning
          component: deployment
        annotations:
          summary: 'Deployment has remained in phase {{ $labels.phase }} for 45 minutes'
          description: 'A normal delivery completes in minutes. The unit deadline is 45 minutes, so this indicates a hung build, migration, or cutover.'
          runbook: 'docs/ops/MONITORING.md#deploystuckinphase'

      - alert: DeployMigrationUncommitted
        expr: apitoken_watchdog_pending_migration == 1
        for: 15m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: 'A production migration started but was never committed'
          description: 'The pending-migration marker survived a full cycle. The database may be partially migrated relative to the recorded manifest.'
          runbook: 'docs/ops/MONITORING.md#deploymigrationuncommitted'

      - alert: SalesReferralReconciliationBacklog
        expr: apitoken_sales_pending_referral_events > 0
        for: 15m
        labels:
          severity: warning
          component: sales-reconciliation
        annotations:
          summary: 'Sales referral feed has buffered events'
          description: '{{ $value }} spend/top-up events arrived before their referral attribution and remain buffered.'
          runbook: 'docs/ops/MONITORING.md#salesreferralreconciliationbacklog'

      - alert: SalesPayoutBatchFailed
        expr: apitoken_sales_failed_payout_batches > 0
        for: 1m
        labels:
          severity: critical
          component: sales-payouts
        annotations:
          summary: 'A sales payout batch is failed'
          description: '{{ $value }} payout batches require manual review.'
          runbook: 'docs/ops/MONITORING.md#salespayoutbatchfailed'

  # The devbot service is optional and disabled until the operator provisions
  # /etc/apitoken/devbot.env: while disabled, ConditionPathExists keeps the unit inactive and
  # this rule stays silent. Once the unit is active, the bot rewrites its textfile heartbeat
  # every 60 seconds, so a missing or stale series means the notification path itself is broken.
  - name: devbot
    rules:
      - alert: DevBotHeartbeatMissing
        expr: |
          node_systemd_unit_state{name="apitoken-devbot.service",state="active"} == 1
          unless on(instance)
          (time() - devbot_heartbeat_timestamp_seconds{job="node"} <= 300)
        for: 5m
        labels:
          severity: warning
          component: devbot
        annotations:
          summary: 'Devbot heartbeat is missing or stale'
          description: 'apitoken-devbot.service is active but the textfile heartbeat devbot_heartbeat_timestamp_seconds{job="node"} has not refreshed for over five minutes.'
          runbook: 'docs/ops/MONITORING.md#devbotheartbeatmissing'

      - alert: DevBotTelegramSendFailures
        expr: |
          increase(devbot_telegram_send_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: devbot
        annotations:
          summary: 'Devbot cannot deliver messages to Telegram'
          description: 'Devbot dropped Telegram send/edit attempts after retries (devbot_telegram_send_failures_total increased during the last fifteen minutes). The process and heartbeat can look healthy while nothing reaches the group.'
          runbook: 'docs/ops/MONITORING.md#devbottelegramsendfailures'

      - alert: DevBotWebhookDeliveryFailing
        expr: |
          increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: devbot
        annotations:
          summary: 'Alertmanager cannot deliver webhook notifications to devbot'
          description: 'Alertmanager webhook deliveries to the devbot receiver failed during the last fifteen minutes. Email keeps flowing; the Telegram path is degraded.'
          runbook: 'docs/ops/MONITORING.md#devbotwebhookdeliveryfailing'

      - alert: DevBotWebhookSilent
        expr: |
          node_systemd_unit_state{name="apitoken-devbot.service",state="active"} == 1
          and on() (time() - max(devbot_last_webhook_seconds) > 86400)
          and on() (sum(alertmanager_alerts{state="active"}) > 0)
        for: 30m
        labels:
          severity: warning
          component: devbot
        annotations:
          summary: 'Devbot webhook has been silent for over a day while alerts are active'
          description: 'The bot is active and Alertmanager has active alerts, but no valid webhook delivery reached devbot for over 24 hours — the Telegram intake path is likely broken or the devbot block was stripped from the rendered alertmanager.yml.'
          runbook: 'docs/ops/MONITORING.md#devbotwebhooksilent'

      - alert: DevBotMetricsDown
        expr: |
          up{job="devbot"} == 0
          and on() (max(node_systemd_unit_state{name="apitoken-devbot.service",state="active"}) == 1)
        for: 2m
        labels:
          severity: warning
          component: devbot
        annotations:
          summary: 'Devbot /metrics cannot be scraped'
          description: 'The devbot scrape target 127.0.0.1:3800 fails while the unit is active, so the metrics behind DevBotTelegramSendFailures and DevBotWebhookSilent are unavailable.'
          runbook: 'docs/ops/MONITORING.md#devbotmetricsdown'
