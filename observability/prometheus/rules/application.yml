groups:
  - name: caddy-ingress
    rules:
      - alert: CaddyUpstreamFiveXxRateHigh
        expr: |
          (
            sum by (host) (rate(caddy_http_request_duration_seconds_count{handler="reverse_proxy",code=~"5.."}[5m]))
            /
            sum by (host) (rate(caddy_http_request_duration_seconds_count{handler="reverse_proxy"}[5m]))
          ) > 0.05
          and
          sum by (host) (rate(caddy_http_request_duration_seconds_count{handler="reverse_proxy"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: caddy
        annotations:
          summary: '{{ $labels.host }} is returning more than 5% upstream 5xx responses'
          description: 'The per-host reverse-proxy 5xx ratio has remained elevated for ten minutes.'
          runbook: 'MONITORING.md#publicendpointdown'

  - name: claude-engine
    rules:
      - alert: EngineCircuitBreakerOpen
        expr: claude_api_breaker_open == 1
        for: 1m
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Claude engine circuit breaker is open'
          description: 'The engine is rejecting traffic because upstream failures crossed the safety threshold.'
          runbook: 'MONITORING.md#enginecircuitbreakeropen'

      - alert: EngineHasNoSubscriptions
        expr: claude_api_subs < 1
        for: 2m
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Claude engine has no available subscriptions'
          description: 'No subscription is currently loaded into the production engine pool.'
          runbook: 'MONITORING.md#enginehasnosubscriptions'

      - alert: EngineAllSubscriptionsCooling
        expr: claude_api_subs > 0 and claude_api_cooling >= claude_api_subs
        for: 2m
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Every Claude subscription is cooling'
          description: 'The pool has no immediately usable subscription capacity.'
          runbook: 'MONITORING.md#engineallsubscriptionscooling'

      - alert: EngineUpstreamRateLimited
        expr: increase(claude_api_upstream_429_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude upstream rate limiting is elevated'
          description: 'More than ten upstream 429 responses were recorded in ten minutes.'
          runbook: 'MONITORING.md#engineupstreamratelimited'

      - alert: EngineUpstreamAuthFailures
        expr: increase(claude_api_upstream_auth_total[5m]) > 0
        labels:
          severity: critical
          component: claude-engine
        annotations:
          summary: 'Claude upstream rejected subscription authentication'
          description: 'At least one new upstream authentication failure was observed.'
          runbook: 'MONITORING.md#engineupstreamauthfailures'

      - alert: EngineUpstreamServerErrors
        expr: increase(claude_api_upstream_5xx_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude upstream 5xx responses are elevated'
          description: 'More than ten upstream server failures were recorded in ten minutes.'
          runbook: 'MONITORING.md#engineupstreamservererrors'

      - alert: EngineAffinityRedisErrors
        expr: increase(claude_api_affinity_redis_errors_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          component: claude-engine
        annotations:
          summary: 'Claude cache-affinity Redis is degraded'
          description: 'Shared affinity operations are failing; requests remain available on local fail-open affinity.'
          runbook: 'MONITORING.md#engineaffinityrediserrors'

  # The OpenAI-compatible Codex provider is optional and fail-closed. Every rule below is gated on
  # claude_api_codex_enabled so a deployment with the provider switched off stays silent.
  - name: codex-provider
    rules:
      - alert: CodexProviderDown
        expr: claude_api_codex_enabled == 1 and claude_api_codex_process_live == 0
        for: 5m
        labels:
          severity: critical
          component: codex-provider
        annotations:
          summary: 'Codex provider has no live app-server'
          description: 'The OpenAI-compatible surface cannot serve any request: no configured home has a live child.'
          runbook: 'MONITORING.md#codexproviderdown'

      - alert: CodexNoAvailableHomes
        expr: claude_api_codex_enabled == 1 and claude_api_codex_homes_available < 1
        for: 5m
        labels:
          severity: critical
          component: codex-provider
        annotations:
          summary: 'Every Codex home is cooling or rate limited'
          description: 'The Codex pool has no home that can accept a request; clients are receiving retryable 429/503 responses.'
          runbook: 'MONITORING.md#codexnoavailablehomes'

      - alert: CodexHomeUnauthenticated
        expr: claude_api_codex_home_authenticated == 0
        for: 15m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} is not authenticated'
          description: 'Its ChatGPT device login no longer passes account/read. Pool capacity is degraded until an operator re-runs the device flow.'
          runbook: 'MONITORING.md#codexhomeunauthenticated'

      - alert: CodexHomeNearRateLimit
        expr: claude_api_codex_home_rate_limit_used_percent > 90
        for: 10m
        labels:
          severity: warning
          component: codex-provider
        annotations:
          summary: 'Codex home {{ $labels.home }} is close to its subscription window limit'
          description: 'The home stops being admitted at the configured headroom; remaining pool capacity should be checked before it is reached.'
          runbook: 'MONITORING.md#codexhomenearratelimit'

  - name: durable-business-state
    rules:
      - alert: DurableQueueBacklog
        expr: apitoken_queue_ready > 25
        for: 10m
        labels:
          severity: warning
          component: '{{ $labels.queue }}'
        annotations:
          summary: '{{ $labels.queue }} has a sustained backlog'
          description: '{{ $value }} durable jobs are ready or retrying.'
          runbook: 'MONITORING.md#durablequeuebacklog'

      - alert: DurableQueueOldestItemStale
        expr: apitoken_queue_oldest_ready_seconds > 900
        for: 5m
        labels:
          severity: critical
          component: '{{ $labels.queue }}'
        annotations:
          summary: 'Oldest {{ $labels.queue }} job is over fifteen minutes old'
          description: 'A ready/retry job has not completed for {{ $value | humanizeDuration }}.'
          runbook: 'MONITORING.md#durablequeueoldestitemstale'

      - alert: DurableQueueDeadItems
        expr: apitoken_queue_dead > 0
        for: 1m
        labels:
          severity: critical
          component: '{{ $labels.queue }}'
        annotations:
          summary: '{{ $labels.queue }} contains terminally failed items'
          description: '{{ $value }} durable jobs require operator investigation.'
          runbook: 'MONITORING.md#durablequeuedeaditems'

      - alert: FailedWebhooksPresent
        expr: apitoken_webhook_failed > 0
        for: 2m
        labels:
          severity: critical
          component: payments
        annotations:
          summary: 'Payment webhooks are in failed state'
          description: '{{ $value }} verified webhook events have failed processing.'
          runbook: 'MONITORING.md#failedwebhookspresent'

      - alert: StaleCheckoutSessions
        expr: apitoken_checkout_stale > 0
        for: 15m
        labels:
          severity: warning
          component: payments
        annotations:
          summary: 'Checkout sessions have remained incomplete for over one hour'
          description: '{{ $value }} checkout sessions are stale.'
          runbook: 'MONITORING.md#stalecheckoutsessions'

      - alert: EngineSettlementBacklog
        expr: apitoken_engine_settlement_pending > 0
        for: 5m
        labels:
          severity: critical
          component: engine-settlement
        annotations:
          summary: 'Engine settlement outbox is not draining'
          description: '{{ $value }} request settlements are pending or processing.'
          runbook: 'MONITORING.md#enginesettlementbacklog'

      - alert: EngineExpiredLeasePresent
        expr: apitoken_engine_expired_active_leases > 0
        for: 2m
        labels:
          severity: critical
          component: engine-authority
        annotations:
          summary: 'Engine contains expired leases still marked active'
          description: '{{ $value }} capacity or reservation leases require reconciliation.'
          runbook: 'MONITORING.md#engineexpiredleasepresent'

      - alert: BackupStale
        expr: apitoken_backup_age_seconds > 5400
        for: 10m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: '{{ $labels.database }} backup is stale'
          description: 'The last validated dump is {{ $value | humanizeDuration }} old.'
          runbook: 'MONITORING.md#backupstale'

      - alert: BackupMissing
        expr: apitoken_backup_present == 0
        for: 2m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: '{{ $labels.database }} backup is missing'
          description: 'No current dump exists for this production database.'
          runbook: 'MONITORING.md#backupmissing'

      - alert: DeployQuarantined
        expr: apitoken_watchdog_quarantined == 1
        for: 2m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: 'A commit failed production delivery and is quarantined'
          description: 'The watchdog rejected the current master candidate; no later stage will run until a newer commit or an explicit retry.'
          runbook: 'MONITORING.md#deployquarantined'

      - alert: DeployPipelineStale
        expr: apitoken_watchdog_status_age_seconds > 900
        for: 5m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: 'The deploy watchdog has not reported for over 15 minutes'
          description: 'The poll loop runs every minute. A status file {{ $value | humanizeDuration }} old means delivery is no longer running.'
          runbook: 'MONITORING.md#deploypipelinestale'

      - alert: DeployStuckInPhase
        expr: apitoken_watchdog_phase{phase!~"idle|quarantined"} == 1
        for: 45m
        labels:
          severity: warning
          component: deployment
        annotations:
          summary: 'Deployment has remained in phase {{ $labels.phase }} for 45 minutes'
          description: 'A normal delivery completes in minutes. The unit deadline is 45 minutes, so this indicates a hung build, migration, or cutover.'
          runbook: 'MONITORING.md#deploystuckinphase'

      - alert: DeployMigrationUncommitted
        expr: apitoken_watchdog_pending_migration == 1
        for: 15m
        labels:
          severity: critical
          component: deployment
        annotations:
          summary: 'A production migration started but was never committed'
          description: 'The pending-migration marker survived a full cycle. The database may be partially migrated relative to the recorded manifest.'
          runbook: 'MONITORING.md#deploymigrationuncommitted'

      - alert: SalesReferralReconciliationBacklog
        expr: apitoken_sales_pending_referral_events > 0
        for: 15m
        labels:
          severity: warning
          component: sales-reconciliation
        annotations:
          summary: 'Sales referral feed has buffered events'
          description: '{{ $value }} spend/top-up events arrived before their referral attribution and remain buffered.'
          runbook: 'MONITORING.md#salesreferralreconciliationbacklog'

      - alert: SalesPayoutBatchFailed
        expr: apitoken_sales_failed_payout_batches > 0
        for: 1m
        labels:
          severity: critical
          component: sales-payouts
        annotations:
          summary: 'A sales payout batch is failed'
          description: '{{ $value }} payout batches require manual review.'
          runbook: 'MONITORING.md#salespayoutbatchfailed'
